<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dictionary of SRE — Graph</title>
    <style>
      :root {
        --bg: #edede9;
        --panel: #f5f5f1;
        --ink: #1c1c1a;
        --muted: #6d6d68;
        --line: #d4d4cf;
        --mono:
          ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
        --sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.55 var(--sans);
        overflow: hidden;
      }
      a {
        color: inherit;
      }
      button {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      #app {
        display: flex;
        height: 100dvh;
      }
      #stage {
        position: relative;
        flex: 1;
        min-width: 0;
        overflow: hidden;
      }
      #graph {
        position: absolute;
        inset: 0;
      }

      .round {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        padding: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 50%;
        cursor: pointer;
      }
      .round:hover {
        border-color: var(--ink);
      }
      .round svg {
        width: 16px;
        height: 16px;
      }

      #top-left {
        position: absolute;
        top: 18px;
        left: 18px;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #brand {
        font: 12px var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #info-btn {
        position: absolute;
        top: 18px;
        right: 18px;
        z-index: 3;
        font-family: var(--mono);
        font-size: 13px;
      }
      #hint {
        position: absolute;
        bottom: 16px;
        left: 18px;
        z-index: 2;
        margin: 0;
        font: 12px var(--mono);
        color: var(--muted);
        pointer-events: none;
      }

      .popover {
        position: absolute;
        top: 66px;
        z-index: 4;
        width: min(360px, calc(100% - 36px));
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgb(0 0 0 / 0.1);
      }
      #search {
        left: 18px;
        overflow: hidden;
      }
      #search input {
        width: 100%;
        padding: 12px 14px;
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--line);
        font: 15px var(--sans);
        color: var(--ink);
        outline: none;
      }
      #results {
        max-height: min(55vh, 420px);
        margin: 0;
        padding: 4px;
        overflow-y: auto;
        list-style: none;
      }
      #results li {
        padding: 7px 10px;
        border-radius: 7px;
        cursor: pointer;
      }
      #results li[aria-selected="true"] {
        background: var(--ink);
        color: var(--panel);
      }
      #results small {
        display: block;
        overflow: hidden;
        font-size: 12px;
        opacity: 0.7;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #results .none {
        color: var(--muted);
        cursor: default;
      }
      #info {
        right: 18px;
        padding: 16px 18px;
        font-size: 14px;
      }
      #info h2 {
        margin: 0 0 6px;
        font: 12px var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      #info p {
        margin: 0 0 8px;
      }
      #info p:last-child {
        margin-bottom: 0;
      }
      kbd {
        padding: 0 5px;
        border: 1px solid var(--line);
        border-radius: 4px;
        font: 12px var(--mono);
      }

      #panel {
        position: relative;
        flex: 0 0 var(--panel-width, min(560px, 42vw));
        height: 100%;
        overflow-y: auto;
        background: var(--panel);
        border-left: 1px solid var(--line);
      }
      #resizer {
        position: relative;
        z-index: 5;
        flex: 0 0 11px;
        margin: 0 -6px 0 -5px;
        cursor: col-resize;
        touch-action: none;
      }
      #resizer::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 4px;
        width: 3px;
        background: transparent;
        transition: background 0.12s;
      }
      #resizer:hover::after,
      #resizer:focus-visible::after,
      .resizing #resizer::after {
        background: var(--ink);
      }
      #resizer:focus-visible {
        outline: none;
      }
      .resizing {
        cursor: col-resize;
        user-select: none;
      }
      #close {
        position: sticky;
        top: 16px;
        z-index: 2;
        float: right;
        margin: 16px 16px 0 0;
        font-size: 18px;
        line-height: 1;
      }
      #panel-body {
        padding: 30px 30px 44px;
      }
      .eyebrow,
      .label {
        font: 11px var(--mono);
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #panel h1 {
        margin: 6px 48px 12px 0;
        font-size: 26px;
        font-weight: 500;
        line-height: 1.15;
        letter-spacing: -0.01em;
        overflow-wrap: anywhere;
        outline: none;
      }
      .lede {
        margin: 0;
        font-size: 16px;
      }
      .block {
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }
      .label {
        display: block;
        margin-bottom: 12px;
      }
      .bubbles {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .bubble {
        max-width: 88%;
        padding: 10px 14px;
        font-size: 14px;
        border-radius: 10px;
      }
      .bubble:nth-child(odd) {
        align-self: flex-start;
        background: #fbfbf8;
        border: 1px solid var(--line);
      }
      .bubble:nth-child(even) {
        align-self: flex-end;
        background: var(--ink);
        color: #f5f5f1;
      }
      .bubble code {
        background: rgb(127 127 127 / 0.22);
      }
      .avoid {
        margin: 0;
        font-size: 14px;
        color: #3b3b38;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .chip {
        padding: 3px 11px;
        font-size: 13px;
        text-decoration: none;
        background: transparent;
        border: 1px solid #a9a9a3;
        border-radius: 999px;
      }
      .chip:hover {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--panel);
      }
      details summary {
        cursor: pointer;
        list-style-position: inside;
      }
      details .label {
        display: inline;
        margin: 0;
      }
      .entry {
        margin-top: 12px;
        font-size: 14px;
      }
      .entry p,
      .entry ul,
      .entry ol,
      .entry blockquote,
      .entry pre,
      .entry .table {
        margin: 0 0 12px;
      }
      .entry ul,
      .entry ol {
        padding-left: 20px;
      }
      .entry h4 {
        margin: 16px 0 6px;
        font-size: 14px;
      }
      .entry blockquote {
        padding-left: 12px;
        border-left: 2px solid var(--line);
      }
      .entry .table {
        overflow-x: auto;
      }
      .entry table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .entry th,
      .entry td {
        padding: 6px 8px 6px 0;
        text-align: left;
        vertical-align: top;
        border-bottom: 1px solid var(--line);
      }
      .entry pre {
        padding: 10px;
        overflow-x: auto;
        background: #e7e7e2;
        border-radius: 6px;
      }
      code {
        padding: 1px 4px;
        font: 0.9em var(--mono);
        background: #e7e7e2;
        border-radius: 4px;
      }
      pre code {
        padding: 0;
        background: none;
      }

      @media (max-width: 720px) {
        #app {
          flex-direction: column;
        }
        #panel {
          flex: 0 0 58dvh;
          width: 100%;
          height: 58dvh;
          border-top: 1px solid var(--line);
          border-left: 0;
        }
        #panel-body {
          padding: 22px 20px 36px;
        }
        #hint,
        #resizer,
        .has-selection #brand {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main id="stage">
        <div
          id="graph"
          role="img"
          aria-label="Force-directed graph of entries and the links between them. Use search to reach one by keyboard."
        ></div>
        <div id="top-left">
          <button
            id="search-btn"
            class="round"
            aria-label="Search entries"
            title="Search (/)"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.8-3.8" />
            </svg>
          </button>
          <span id="brand">Dictionary of SRE</span>
        </div>
        <button
          id="info-btn"
          class="round"
          aria-label="About this graph"
          aria-expanded="false"
          title="About"
        >
          i
        </button>
        <div id="search" class="popover" hidden>
          <input
            id="search-input"
            type="search"
            placeholder="Search entries"
            aria-label="Search entries"
            role="combobox"
            aria-expanded="true"
            aria-controls="results"
            autocomplete="off"
            spellcheck="false"
          />
          <ul id="results" role="listbox" aria-label="Matching entries"></ul>
        </div>
        <div id="info" class="popover" hidden>
          <h2>Reading the graph</h2>
          <p id="info-counts"></p>
          <p>
            Larger, darker circles are linked to by more entries. Dots on a line
            move in the direction of the link.
          </p>
          <p>
            Click a circle to read it. Drag to rearrange, scroll to zoom.
            <kbd>/</kbd> searches, <kbd>Esc</kbd> closes.
          </p>
        </div>
        <p id="hint">Click a circle, or press / to search</p>
      </main>
      <div
        id="resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize details panel"
        aria-controls="panel"
        tabindex="0"
        title="Drag to resize, double-click to reset"
        hidden
      ></div>
      <aside id="panel" aria-label="Term details" hidden>
        <button id="close" class="round" aria-label="Close details">×</button>
        <div id="panel-body"></div>
      </aside>
    </div>

    <script id="graph-data" type="application/json">
      {"title":"Dictionary of SRE","noun":"entry","nouns":"entries","labels":{"quotes":"Heard in the wild","note":"Note","outgoing":"Connects to","incoming":"Linked from","body":"Full entry"},"sections":["Reliability Targets","Observability","What to Measure","Alerting and On-Call","Incidents","Capacity and Performance","Learning from Change"],"terms":[{"name":"Site reliability engineering","section":0,"description":"A discipline that keeps production services reliable by applying software engineering to operations work.","body":"\u003cp>Site reliability engineering (SRE) is the discipline of keeping production services reliable by applying software engineering to operations work. The term comes from Google, where Ben Treynor Sloss started an SRE team in 2003. An SRE team writes automation, sets reliability targets, responds to failures and feeds what it learns back into the software.\u003c/p>\u003cp>SRE addresses a conflict between shipping and stability. Developers are rewarded for releasing changes, operators for keeping systems steady, and each release can turn into a negotiation. SRE replaces that argument with a number: the team agrees an \u003ca href=\"#SLO\" data-term=\"SLO\">SLO\u003c/a>, and the gap between that target and 100% becomes an \u003ca href=\"#Error%20budget\" data-term=\"Error budget\">error budget\u003c/a> that can be spent on risky change.\u003c/p>\u003cp>Typical SRE work falls into these areas:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Practice\u003c/th>\u003cth>What the team does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Set targets\u003c/td>\u003ctd>Defines \u003ca href=\"#SLI\" data-term=\"SLI\">SLIs\u003c/a> and SLOs with product owners\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reduce \u003ca href=\"#Toil\" data-term=\"Toil\">toil\u003c/a>\u003c/td>\u003ctd>Automates repetitive manual work\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Build visibility\u003c/td>\u003ctd>Adds \u003ca href=\"#Observability\" data-term=\"Observability\">observability\u003c/a> so production behaviour can be explained\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Share \u003ca href=\"#On-call\" data-term=\"On-call\">on-call\u003c/a>\u003c/td>\u003ctd>Responds to \u003ca href=\"#Alert\" data-term=\"Alert\">alerts\u003c/a> and \u003ca href=\"#Incident\" data-term=\"Incident\">incidents\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Learn from failure\u003c/td>\u003ctd>Writes \u003ca href=\"#Blameless%20postmortem\" data-term=\"Blameless postmortem\">blameless postmortems\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Plan ahead\u003c/td>\u003ctd>Does \u003ca href=\"#Capacity%20planning\" data-term=\"Capacity planning\">capacity planning\u003c/a> before demand arrives\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>SRE is different from renaming an operations team. A team that spends all day on tickets, with no time for engineering, is doing operations under a new title. The usual symptom is a pager load that grows in step with the number of services. Google's published guidance caps operational work at 50% of an SRE's time so the rest can go to engineering that reduces future work.\u003c/p>\u003cp>SRE overlaps with DevOps, the broader practice of developers and operators sharing responsibility for delivery. DevOps describes a culture and a set of goals. SRE is one specific way of pursuing them, built around numeric targets.\u003c/p>","avoid":"","usage":["We hired two SREs and now they get every ticket nobody else wants.","Then we've built an ops team. Give them the SLOs, cap the interrupt work, and let them automate the top sources of pages."],"out":[4,6,3,8,12,39,35,41,45,47]},{"name":"Availability","section":0,"description":"The share of time or requests in which a service works correctly for its users, usually given as a percentage.","body":"\u003cp>Availability is the proportion of time, or of requests, in which a service does its job correctly for users. It is normally written as a percentage and often shortened to a count of \u003ca href=\"#Nines\" data-term=\"Nines\">nines\u003c/a>, so 99.9% is &quot;three nines&quot;.\u003c/p>\u003cp>There are two common ways to calculate it:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Method\u003c/th>\u003cth>Formula\u003c/th>\u003cth>Strength\u003c/th>\u003cth>Weakness\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Time-based\u003c/td>\u003ctd>uptime / (uptime + downtime)\u003c/td>\u003ctd>Easy to explain\u003c/td>\u003ctd>Counts a 3am outage and a peak outage equally\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Request-based\u003c/td>\u003ctd>successful requests / valid requests\u003c/td>\u003ctd>Reflects traffic users sent\u003c/td>\u003ctd>Says little when there is no traffic\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The two methods can disagree about the same month. Take a hypothetical service with 10,000,000 requests in 30 days, of which 5,000 failed during one 30-minute total outage. Request-based availability is 9,995,000 / 10,000,000 = 99.95%. Time-based availability is 43,170 / 43,200 minutes = 99.93%. They differ because traffic during the outage was below the monthly average.\u003c/p>\u003cp>A service can look up while being unavailable to users. The status page is green and the health check returns 200, yet checkout fails for every customer in one region. For this reason, availability is best defined from the user's side through an \u003ca href=\"#SLI\" data-term=\"SLI\">SLI\u003c/a>, and a response that is too slow to be useful can count as a failure.\u003c/p>\u003cp>Dependencies limit what a service can reach. If a request needs two components in series, each 99.9% available, and their failures are independent, the combined figure is 0.999 x 0.999, or about 99.8%. Redundant copies raise availability only when they fail independently. Two replicas running the same bad configuration fail together.\u003c/p>\u003cp>Teams set a target through an \u003ca href=\"#SLO\" data-term=\"SLO\">SLO\u003c/a> instead of aiming for 100%, because each extra nine costs more.\u003c/p>","avoid":"","usage":["The uptime check says 100% this month, but support has a queue of failed payments.","That probe only hits the health endpoint. Measure availability from real checkout requests and the number will drop."],"out":[2,3,4]},{"name":"Nines","section":0,"description":"Shorthand for availability targets, such as three nines for 99.9%. Each added nine cuts allowed downtime by a factor of ten.","body":"\u003cp>Nines are shorthand for \u003ca href=\"#Availability\" data-term=\"Availability\">availability\u003c/a> percentages, counted by the number of 9 digits. 99.9% is three nines and 99.999% is five nines. Each added nine divides the allowed downtime by ten.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Availability\u003c/th>\u003cth>Name\u003c/th>\u003cth>Downtime per 30-day month\u003c/th>\u003cth>Downtime per 365-day year\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>99%\u003c/td>\u003ctd>Two nines\u003c/td>\u003ctd>7.2 hours\u003c/td>\u003ctd>3.65 days\u003c/td>\u003c/tr>\u003ctr>\u003ctd>99.9%\u003c/td>\u003ctd>Three nines\u003c/td>\u003ctd>43.2 minutes\u003c/td>\u003ctd>8.76 hours\u003c/td>\u003c/tr>\u003ctr>\u003ctd>99.95%\u003c/td>\u003ctd>Three and a half\u003c/td>\u003ctd>21.6 minutes\u003c/td>\u003ctd>4.38 hours\u003c/td>\u003c/tr>\u003ctr>\u003ctd>99.99%\u003c/td>\u003ctd>Four nines\u003c/td>\u003ctd>4.32 minutes\u003c/td>\u003ctd>52.56 minutes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>99.999%\u003c/td>\u003ctd>Five nines\u003c/td>\u003ctd>25.92 seconds\u003c/td>\u003ctd>5.26 minutes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The calculation is (1 - availability) x period. For three nines in a 30-day month, that is 0.001 x 43,200 minutes = 43.2 minutes.\u003c/p>\u003cp>The table explains why a target that sounds modest can be out of reach. Four nines allows 4.32 minutes of full outage per month. If paging a person, opening a laptop and finding the problem takes 15 minutes, a single \u003ca href=\"#Incident\" data-term=\"Incident\">incident\u003c/a> breaks the target before anyone has started the fix. Targets at that level need automatic detection and automatic recovery, such as moving traffic to a healthy copy without human involvement.\u003c/p>\u003cp>Serial dependencies multiply. A request that passes through five components, each at 99.99%, gets at most 0.9999^5, or about 99.95%, assuming independent failures. A service cannot promise more nines than its critical dependencies allow unless it keeps working when they fail.\u003c/p>\u003cp>Nines also hide the shape of downtime. Ten 4-minute outages and one 40-minute outage produce the same monthly total but affect users differently, and the percentage does not say which users were hit. An \u003ca href=\"#SLO\" data-term=\"SLO\">SLO\u003c/a> written in nines needs a defined measurement and window to mean anything.\u003c/p>","avoid":"","usage":["Sales wants to promise four nines on the API.","That's about four minutes a month, and our database failover alone takes three. We can't sign that without automated recovery."],"out":[1,41,4]},{"name":"SLI","section":0,"description":"Service level indicator. A measured ratio of good events to valid events that describes service quality as users see it.","body":"\u003cp>A service level indicator (SLI) is a measurement of one aspect of service quality as users experience it. The recommended form is a ratio: good events divided by valid events, expressed as a percentage. Because every SLI then sits on the same 0 to 100% scale, it can feed an \u003ca href=\"#SLO\" data-term=\"SLO\">SLO\u003c/a> and an \u003ca href=\"#Error%20budget\" data-term=\"Error budget\">error budget\u003c/a> in the same way.\u003c/p>\u003cp>Common SLIs by type of service:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Service type\u003c/th>\u003cth>SLI\u003c/th>\u003cth>A good event is\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Request API\u003c/td>\u003ctd>\u003ca href=\"#Availability\" data-term=\"Availability\">Availability\u003c/a>\u003c/td>\u003ctd>A response that is not a server error\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Request API\u003c/td>\u003ctd>Latency\u003c/td>\u003ctd>A response in under 300 ms\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Data pipeline\u003c/td>\u003ctd>Freshness\u003c/td>\u003ctd>A record processed within 10 minutes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Storage\u003c/td>\u003ctd>Durability\u003c/td>\u003ctd>A stored object read back intact\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Batch job\u003c/td>\u003ctd>Completion\u003c/td>\u003ctd>A scheduled run finishing on time\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Defining an SLI takes three decisions: which events count, what makes one good, and where it is measured.\u003c/p>\u003cp>The measurement point changes the answer. A \u003ca href=\"#Metric\" data-term=\"Metric\">metric\u003c/a> recorded inside the application misses requests that never reached it, such as those dropped by a load balancer or lost to a DNS failure. Measuring at the load balancer, or with \u003ca href=\"#Real%20user%20monitoring\" data-term=\"Real user monitoring\">real user monitoring\u003c/a>, sits closer to what users saw but adds noise.\u003c/p>\u003cp>Exclusions need the same care. Client errors are usually left out of valid events, but a burst of 401s from a broken login flow is a real failure, and excluding it makes a broken feature look healthy.\u003c/p>\u003cp>A weak SLI shows up as a green dashboard while users complain. CPU and memory are poor SLIs because users do not experience them directly. An average latency hides slow requests, whereas &quot;share of requests under 300 ms&quot; counts them. A \u003ca href=\"#Histogram\" data-term=\"Histogram\">histogram\u003c/a> with a bucket boundary at the threshold makes that count exact.\u003c/p>","avoid":"","usage":["Our availability SLI says 99.99, but customers keep reporting failed uploads.","It only counts requests that reach the app. Uploads rejected at the proxy never show up. Move the measurement to the load balancer."],"out":[4,6,1,17,34,20]},{"name":"SLO","section":0,"description":"Service level objective. A target for an SLI over a time window, such as 99.9% of requests succeeding over 30 days.","body":"\u003cp>A service level objective (SLO) is a target value for an \u003ca href=\"#SLI\" data-term=\"SLI\">SLI\u003c/a> over a defined time window. It states how reliable a service needs to be, and so also how much unreliability is acceptable.\u003c/p>\u003cp>An SLO has three parts:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Part\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>SLI\u003c/td>\u003ctd>Share of checkout requests that succeed in under 500 ms\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Target\u003c/td>\u003ctd>99.9%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Window\u003c/td>\u003ctd>Rolling 30 days\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The gap between the target and 100% is the \u003ca href=\"#Error%20budget\" data-term=\"Error budget\">error budget\u003c/a>. In this example, 0.1% of checkout requests may fail or run slow before the objective is missed.\u003c/p>\u003cp>The window can be rolling or calendar-based. A rolling window always covers the last 30 days, so a bad week keeps counting until it ages out. A calendar window resets on the first of the month, which suits reporting but lets a team start fresh the day after a major outage.\u003c/p>\u003cp>Choose a target from what users tolerate and what the service has achieved recently. A target set too high means every small blip blocks releases, and teams soon start ignoring it. A target set too low reports success while users are unhappy, which appears as a healthy SLO dashboard next to a growing pile of support tickets. Review the target periodically against complaints and \u003ca href=\"#Incident\" data-term=\"Incident\">incident\u003c/a> history.\u003c/p>\u003cp>An SLO only has an effect if missing it changes a decision. An \u003ca href=\"#Error%20budget%20policy\" data-term=\"Error budget policy\">error budget policy\u003c/a> records what the team will do when the budget runs low. Avoid 100% as a target: it cannot be met, and it leaves no room for releases or maintenance.\u003c/p>\u003cp>Keep internal SLOs tighter than any external \u003ca href=\"#SLA\" data-term=\"SLA\">SLA\u003c/a>. The difference gives the team a warning and time to react before a contract is breached.\u003c/p>","avoid":"","usage":["Latency spiked for twenty minutes yesterday. Do we need to drop everything?","Check the SLO first. We've used 12% of the budget this window, so file a follow-up and keep the release on track."],"out":[3,6,41,7,5]},{"name":"SLA","section":0,"description":"Service level agreement. A contract promising a level of service, with a remedy such as credits if the provider misses it.","body":"\u003cp>A service level agreement (SLA) is a contract between a provider and a customer that promises a level of service and states what happens if the provider misses it. The usual remedy is a service credit, which is a partial refund on the bill. That contractual consequence separates an SLA from an \u003ca href=\"#SLO\" data-term=\"SLO\">SLO\u003c/a>, which is an internal target.\u003c/p>\u003cp>The three related terms differ as follows:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Term\u003c/th>\u003cth>What it is\u003c/th>\u003cth>Example\u003c/th>\u003cth>If missed\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#SLI\" data-term=\"SLI\">SLI\u003c/a>\u003c/td>\u003ctd>A measurement\u003c/td>\u003ctd>99.93% of requests succeeded\u003c/td>\u003ctd>Nothing, it is a reading\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SLO\u003c/td>\u003ctd>Internal target\u003c/td>\u003ctd>99.9% over 30 days\u003c/td>\u003ctd>Team follows its \u003ca href=\"#Error%20budget%20policy\" data-term=\"Error budget policy\">error budget policy\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SLA\u003c/td>\u003ctd>External contract\u003c/td>\u003ctd>99.5% per calendar month\u003c/td>\u003ctd>Customer may receive credits\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The SLO is normally set tighter than the SLA so the team gets a warning before money is at stake. With the numbers above, in a 30-day month, the SLO allows 43.2 minutes of full outage and the SLA allows 3.6 hours. A team that has just exhausted its SLO still has about 2.9 hours of further downtime before the contract is breached.\u003c/p>\u003cp>The definitions in the contract decide what counts. Many SLAs exclude scheduled maintenance, customer-caused failures and events outside the provider's control, and some measure \u003ca href=\"#Availability\" data-term=\"Availability\">availability\u003c/a> in their own way, such as counting a minute as down only above an error threshold. Customers often have to file a claim with evidence before a deadline. A common surprise follows a long provider outage: the credit covers a small part of one bill and none of the revenue lost.\u003c/p>\u003cp>Your own SLA is limited by those of your dependencies. If you promise 99.95% while relying on a provider that guarantees 99.9%, your business carries the difference. Check dependency terms before signing.\u003c/p>","avoid":"","usage":["The customer wants 99.99% in the contract. We hit that last quarter.","One good quarter isn't an SLA. Our SLO is 99.9%, so offer 99.5% and keep a margin before credits start."],"out":[4,3,7,1]},{"name":"Error budget","section":0,"description":"The amount of failure an SLO allows during its window, which a team can spend on releases, experiments and other risk.","body":"\u003cp>An error budget is the amount of failure an \u003ca href=\"#SLO\" data-term=\"SLO\">SLO\u003c/a> permits during its window. It equals 100% minus the SLO, so a 99.9% SLO has a 0.1% error budget.\u003c/p>\u003cp>A hypothetical service shows how the percentage becomes a usable number:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Input\u003c/th>\u003cth>Value\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>SLO\u003c/td>\u003ctd>99.9% over 30 days\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Budget as a share\u003c/td>\u003ctd>0.1%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Expected requests in the window\u003c/td>\u003ctd>10,000,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Budget in failed requests\u003c/td>\u003ctd>10,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Budget as time at total outage\u003c/td>\u003ctd>43.2 minutes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>If a bad deployment fails 4,000 requests, 40% of the budget is gone and 6,000 failures remain. Partial failures spend budget more slowly. At steady traffic, 5% of requests failing for one hour costs the same as a total outage of three minutes, because 0.05 x 60 = 3.\u003c/p>\u003cp>The budget gives product and engineering one shared number for decisions about risk. Without it, teams argue about whether a release feels too dangerous, and the outcome depends on opinion. With it, budget remaining means the team can keep shipping, and a nearly empty budget means effort moves to stability. An \u003ca href=\"#Error%20budget%20policy\" data-term=\"Error budget policy\">error budget policy\u003c/a> writes those consequences down in advance.\u003c/p>\u003cp>Every user-visible failure spends the budget, whatever the cause: bad deployments, dependency outages, traffic spikes and planned maintenance. Tracking spend by cause shows which fix would return the most budget.\u003c/p>\u003cp>With a rolling window, old failures age out and the budget recovers gradually. A \u003ca href=\"#Burn%20rate%20alert\" data-term=\"Burn rate alert\">burn rate alert\u003c/a> watches how quickly the budget is being spent, so a fast failure pages someone long before the budget is empty. A budget that is never touched for several quarters is also information: the SLO may be stricter than users need, or the team may be releasing too cautiously.\u003c/p>","avoid":"","usage":["Can we ship the new auth flow on Thursday?","Monday's outage used 85% of the error budget. Let's hold it until the window recovers, or release it behind a flag to 1% of users."],"out":[4,7,38]},{"name":"Error budget policy","section":0,"description":"A pre-agreed document stating what a team does as its error budget runs down, such as pausing risky releases.","body":"\u003cp>An \u003ca href=\"#Error%20budget\" data-term=\"Error budget\">error budget\u003c/a> policy is a written agreement stating what a team does as that budget is consumed. Product and engineering leads agree it before it is needed, so a decision to slow releases is not renegotiated during a bad month.\u003c/p>\u003cp>Without a policy, an \u003ca href=\"#SLO\" data-term=\"SLO\">SLO\u003c/a> has no consequence. The familiar pattern is a team that misses its target three months running, notes this in a review, and keeps shipping at the same pace because nobody agreed what a miss should change.\u003c/p>\u003cp>A policy is usually a ladder of responses. The thresholds below are an example, not a standard:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Budget consumed\u003c/th>\u003cth>Response\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Under 50%\u003c/td>\u003ctd>Normal releases\u003c/td>\u003c/tr>\u003ctr>\u003ctd>50% to 75%\u003c/td>\u003ctd>Review recent failures and roll out risky changes more slowly\u003c/td>\u003c/tr>\u003ctr>\u003ctd>75% to 100%\u003c/td>\u003ctd>Low-risk changes only, with extra review of each release\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Over 100%\u003c/td>\u003ctd>Freeze feature releases and prioritise reliability work until the service is back within SLO\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A useful policy also answers the questions that come up under pressure. It says which changes are exempt from a freeze, typically security and legal fixes and the fix for the outage itself. It says whether failures caused by an external dependency count. It sets a trigger for review, such as requiring a \u003ca href=\"#Blameless%20postmortem\" data-term=\"Blameless postmortem\">blameless postmortem\u003c/a> for any single \u003ca href=\"#Incident\" data-term=\"Incident\">incident\u003c/a> that consumes more than 20% of the budget. It also names who can override the policy and how that decision is recorded.\u003c/p>\u003cp>A freeze redirects engineering effort toward whatever burned the budget. If freezes keep blocking work for months, the target may be unrealistic for the current system. In that case, renegotiate the SLO using the data, or fund the reliability work, instead of quietly ignoring the policy.\u003c/p>","avoid":"","usage":["Product says the launch can't slip, but we're at 110% of budget.","The error budget policy they signed says feature freeze. If they want an exception, the VP records it and we accept the risk explicitly."],"out":[6,4,45,41]},{"name":"Toil","section":0,"description":"Manual, repetitive operational work that could be automated, leaves no lasting value and grows as the service grows.","body":"\u003cp>Toil is operational work that is manual, repetitive, automatable, reactive, without lasting value, and growing in proportion to the service. Restarting a stuck worker every morning, resizing disks by hand and rotating a certificate from a checklist are typical examples. The term is used in \u003ca href=\"#Site%20reliability%20engineering\" data-term=\"Site reliability engineering\">site reliability engineering\u003c/a> to separate this work from engineering that improves the system.\u003c/p>\u003cp>A task is more likely to be toil the more of these tests it meets:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Test\u003c/th>\u003cth>Question\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Manual\u003c/td>\u003ctd>Does a person have to run it?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Repetitive\u003c/td>\u003ctd>Has the team done this many times before?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Automatable\u003c/td>\u003ctd>Could a machine do it equally well?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tactical\u003c/td>\u003ctd>Is it driven by interrupts instead of a plan?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>No lasting value\u003c/td>\u003ctd>Is the service unchanged once it is done?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scales with growth\u003c/td>\u003ctd>Does twice the traffic mean twice the work?\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Not all unpleasant work is toil. Investigating a new kind of failure is engineering, because it produces knowledge the team did not have.\u003c/p>\u003cp>The symptom of too much toil is a team that is busy all week while nothing improves. Project work keeps slipping, \u003ca href=\"#On-call\" data-term=\"On-call\">on-call\u003c/a> shifts are spent clearing tickets, and each new service means asking for more headcount. Google's SRE guidance caps operational work at 50% of an engineer's time for this reason.\u003c/p>\u003cp>Start by measuring. Record hours by category for a few weeks, then address the largest item. Prefer removing the need over scripting it: fix the bug that makes the worker stick instead of automating the restart. A \u003ca href=\"#Runbook\" data-term=\"Runbook\">runbook\u003c/a> followed identically every time is a good candidate for automation. Compare costs before building anything. A 30-minute weekly task takes 26 hours a year, so automation that takes 16 hours to build pays back in 32 weeks.\u003c/p>","avoid":"","usage":["I spent half of on-call manually clearing the stuck export queue again.","That's toil. Let's find why it sticks this sprint, because a cron job to clear it just hides the bug."],"out":[0,39,40]},{"name":"MTTD","section":0,"description":"Mean time to detect. The average gap between an incident starting and a person or system noticing it.","body":"\u003cp>Mean time to detect (MTTD) is the average time between the start of an \u003ca href=\"#Incident\" data-term=\"Incident\">incident\u003c/a> and its detection. Detection is usually an \u003ca href=\"#Alert\" data-term=\"Alert\">alert\u003c/a> firing. It can also be a customer ticket, which means the team's \u003ca href=\"#Monitoring\" data-term=\"Monitoring\">monitoring\u003c/a> missed the problem.\u003c/p>\u003cp>The mean is easily distorted by one case. If four incidents were detected after 2, 3, 5 and 30 minutes, the mean is 10 minutes and the median is 4. Report the median and the longest case alongside the mean, particularly when the sample is small.\u003c/p>\u003cp>Several things set a lower limit on detection time:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Source of delay\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Collection\u003c/td>\u003ctd>A \u003ca href=\"#Metric\" data-term=\"Metric\">metric\u003c/a> scraped every 60 seconds\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pipeline lag\u003c/td>\u003ctd>\u003ca href=\"#Log\" data-term=\"Log\">Logs\u003c/a> that take minutes to become searchable\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Alert window\u003c/td>\u003ctd>A rule that requires a condition to hold for 10 minutes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Missing coverage\u003c/td>\u003ctd>A failure no check measures, found only when users complain\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The recognisable symptom of poor detection is learning about an outage from support, a sales colleague or social media while every dashboard still looks normal. \u003ca href=\"#Symptom-based%20alerting\" data-term=\"Symptom-based alerting\">Symptom-based alerting\u003c/a> closes much of this gap by watching what users experience, and \u003ca href=\"#Synthetic%20monitoring\" data-term=\"Synthetic monitoring\">synthetic monitoring\u003c/a> can catch failures on paths that have little traffic at that hour.\u003c/p>\u003cp>Lowering detection time has a cost. Tighter thresholds and shorter windows fire on more harmless blips, which feeds \u003ca href=\"#Alert%20fatigue\" data-term=\"Alert fatigue\">alert fatigue\u003c/a>. A \u003ca href=\"#Burn%20rate%20alert\" data-term=\"Burn rate alert\">burn rate alert\u003c/a> handles this trade-off by detecting severe failures quickly and small ones more slowly.\u003c/p>\u003cp>MTTD also has two measurement hazards. The start time is often established afterwards from graphs, so teams need a consistent rule for recording it. And the metric covers only incidents that were noticed. A failure nobody detected does not appear in the average, so a low MTTD can coexist with blind spots.\u003c/p>","avoid":"","usage":["Our MTTD looks great this quarter, under three minutes.","Only for the incidents that paged. The two that customers reported first aren't timed at all, so fix how we record those."],"out":[41,35,13,17,15,37,33,36,38]},{"name":"MTTR","section":0,"description":"Mean time to restore, repair, respond or resolve. An ambiguous incident average, so state which version you mean.","body":"\u003cp>MTTR is an average \u003ca href=\"#Incident\" data-term=\"Incident\">incident\u003c/a> duration, and the R stands for different things depending on who is speaking. Two teams can report the same acronym while measuring different intervals, so a comparison between them may mean nothing until the definition is agreed.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Expansion\u003c/th>\u003cth>The clock stops when\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Mean time to respond\u003c/td>\u003ctd>Someone starts working on the problem\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mean time to restore\u003c/td>\u003ctd>Users have working service again\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mean time to repair\u003c/td>\u003ctd>The faulty component is fixed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mean time to resolve\u003c/td>\u003ctd>The incident is closed, including follow-up\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Time to restore is usually the useful version for reliability, because it matches the period users were affected. A team that restores service in 10 minutes through a \u003ca href=\"#Mitigation\" data-term=\"Mitigation\">mitigation\u003c/a> and ships the permanent fix three days later has a restore time of 10 minutes and a resolve time of three days.\u003c/p>\u003cp>Averages describe incident durations poorly, because most incidents are short and a few are very long. Take six hypothetical incidents lasting 10, 15, 20, 25, 30 and 300 minutes. The mean is about 67 minutes and the median is 22.5. Without the 300-minute outage the mean would be 20, so one incident more than tripled it with no change in how the team works. Quarter-on-quarter MTTR can move this way from chance alone. Report the median and the longest incident, and read the individual timelines.\u003c/p>\u003cp>MTTR can also move the wrong way when things improve. If a team eliminates its short, easy incidents, only the long ones remain and the average rises.\u003c/p>\u003cp>To reduce restore time, split it into stages: \u003ca href=\"#MTTD\" data-term=\"MTTD\">MTTD\u003c/a>, time to diagnose and time to mitigate. Then work on the stage that dominates. Together with \u003ca href=\"#MTBF\" data-term=\"MTBF\">MTBF\u003c/a>, restore time determines steady-state \u003ca href=\"#Availability\" data-term=\"Availability\">availability\u003c/a>.\u003c/p>","avoid":"","usage":["Leadership wants MTTR down 20% by next quarter.","Which R? And with nine incidents a quarter, one bad night swings the mean. Let's target median time to restore instead."],"out":[41,44,9,11,1]},{"name":"MTBF","section":0,"description":"Mean time between failures. The average working time between one failure and the next in a repairable system.","body":"\u003cp>Mean time between failures (MTBF) is the average working time between one failure of a repairable system and the next. It is calculated as total operating time divided by the number of failures. Some sources measure from the start of one failure to the start of the next, which includes repair time, so check the definition before comparing figures.\u003c/p>\u003cp>Take a hypothetical service over a 30-day month, or 720 hours, with three failures that each take 2 hours to restore. Downtime is 6 hours and operating time is 714 hours, so MTBF is 714 / 3 = 238 hours and \u003ca href=\"#MTTR\" data-term=\"MTTR\">MTTR\u003c/a> is 2 hours. Steady-state \u003ca href=\"#Availability\" data-term=\"Availability\">availability\u003c/a> is MTBF / (MTBF + MTTR) = 238 / 240, or about 99.17%.\u003c/p>\u003cp>That formula shows the two ways to raise availability:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Change\u003c/th>\u003cth>MTBF\u003c/th>\u003cth>MTTR\u003c/th>\u003cth>Availability\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Baseline\u003c/td>\u003ctd>238 h\u003c/td>\u003ctd>2 h\u003c/td>\u003ctd>99.17%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Failures half as often\u003c/td>\u003ctd>476 h\u003c/td>\u003ctd>2 h\u003c/td>\u003ctd>99.58%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Recovery four times faster\u003c/td>\u003ctd>238 h\u003c/td>\u003ctd>0.5 h\u003c/td>\u003ctd>99.79%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>In this example, faster recovery gains more than halving the failure rate.\u003c/p>\u003cp>MTBF is commonly misread on hardware spec sheets. A disk rated at 1,000,000 hours will not last 114 years. The figure describes a failure rate across a large population during its service life. A fleet of 1,000 such disks running for a year accumulates 8,760,000 disk-hours, so you should expect about 8.76 failures that year.\u003c/p>\u003cp>The \u003ca href=\"#Metric\" data-term=\"Metric\">metric\u003c/a> assumes a roughly constant failure rate, which suits hardware better than software. Software failures tend to cluster around changes, so a service can run quietly for weeks and then have three \u003ca href=\"#Incident\" data-term=\"Incident\">incidents\u003c/a> in a day after a release. For services, an \u003ca href=\"#SLO\" data-term=\"SLO\">SLO\u003c/a> usually says more about what users experienced.\u003c/p>","avoid":"","usage":["The vendor quotes a million-hour MTBF, so we don't need spare drives, right?","With 2,000 drives that's roughly 18 failures a year. Keep the spares and make sure rebuilds are automatic."],"out":[10,1,17,41,4]},{"name":"Observability","section":1,"description":"How well a system's internal state can be worked out from its outputs, including during failures nobody predicted.","body":"\u003cp>Observability is the degree to which you can work out what a system is doing internally from the data it emits. The word comes from control theory. In software, an observable system lets an engineer answer a new question about production without shipping new code to collect the answer.\u003c/p>\u003cp>It is often contrasted with \u003ca href=\"#Monitoring\" data-term=\"Monitoring\">monitoring\u003c/a>:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Aspect\u003c/th>\u003cth>Monitoring\u003c/th>\u003cth>Observability\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Questions\u003c/td>\u003ctd>Known in advance\u003c/td>\u003ctd>Arise during an investigation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Typical output\u003c/td>\u003ctd>Dashboards and \u003ca href=\"#Alert\" data-term=\"Alert\">alerts\u003c/a>\u003c/td>\u003ctd>Exploratory queries\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Example\u003c/td>\u003ctd>&quot;Is the error rate above 1%?&quot;\u003c/td>\u003ctd>&quot;Which customers on which version see these errors?&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Needs\u003c/td>\u003ctd>Predefined \u003ca href=\"#Metric\" data-term=\"Metric\">metrics\u003c/a>\u003c/td>\u003ctd>Detailed, high-\u003ca href=\"#Cardinality\" data-term=\"Cardinality\">cardinality\u003c/a> \u003ca href=\"#Telemetry\" data-term=\"Telemetry\">telemetry\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The symptom of low observability is a dashboard that shows errors rising while nobody can say why. The team adds a \u003ca href=\"#Log\" data-term=\"Log\">log\u003c/a> line, deploys it, waits for the failure to recur, and repeats. Each question costs a deployment, and the \u003ca href=\"#Incident\" data-term=\"Incident\">incident\u003c/a> continues in the meantime. In an observable system, each request already carries context such as customer, version, region and enabled features, so the same question becomes a query.\u003c/p>\u003cp>The usual data sources are metrics, logs and \u003ca href=\"#Distributed%20trace\" data-term=\"Distributed trace\">distributed traces\u003c/a>, often called the three pillars. Collecting all three does not produce observability by itself. If they cannot be correlated, an engineer ends up copying timestamps between tools. A shared trace ID lets you move from a slow trace to the log lines for that exact request.\u003c/p>\u003cp>Detailed telemetry costs money to store and process. \u003ca href=\"#Sampling\" data-term=\"Sampling\">Sampling\u003c/a> and retention limits keep that cost under control. Instrumentation is also ongoing work, and it is easier to add alongside a feature than during an outage. \u003ca href=\"#OpenTelemetry\" data-term=\"OpenTelemetry\">OpenTelemetry\u003c/a> is a common vendor-neutral way to do it.\u003c/p>","avoid":"","usage":["Errors are up on checkout, but I can't tell who's affected. Can we add a log and redeploy?","That's the third redeploy tonight. After this, let's put customer and version on every \u003ca href=\"#Span\" data-term=\"Span\">span\u003c/a> so the next one is a query."],"out":[13,35,17,22,14,15,41,23,26,27,24]},{"name":"Monitoring","section":1,"description":"Collecting predefined measurements from a system and watching them through dashboards and alerts.","body":"\u003cp>Monitoring is the practice of collecting predefined measurements from a system, displaying them and raising an \u003ca href=\"#Alert\" data-term=\"Alert\">alert\u003c/a> when they cross a threshold. It answers questions known in advance: is the service up, what is the error rate, is the disk filling.\u003c/p>\u003cp>Monitoring can look at a system from two positions, and teams generally use both:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Approach\u003c/th>\u003cth>Measures from\u003c/th>\u003cth>Sees\u003c/th>\u003cth>Misses\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>White-box\u003c/td>\u003ctd>Inside, through emitted \u003ca href=\"#Metric\" data-term=\"Metric\">metrics\u003c/a>\u003c/td>\u003ctd>Queue depth, internals, early warning\u003c/td>\u003ctd>Failures that stop the service reporting\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Black-box\u003c/td>\u003ctd>Outside, as a client would, such as \u003ca href=\"#Synthetic%20monitoring\" data-term=\"Synthetic monitoring\">synthetic monitoring\u003c/a>\u003c/td>\u003ctd>What a user would get\u003c/td>\u003ctd>Why it is failing\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Monitoring can fail silently. If the monitoring system goes down along with what it watches, no alert fires and the dashboard shows a gap. A rule such as &quot;error rate above 1%&quot; also stays quiet when a service stops reporting altogether, because missing data does not satisfy the condition. An engineer then reads a flat line as a quiet night.\u003c/p>\u003cp>Three measures reduce that risk. Run monitoring on infrastructure separate from the systems it observes. Alert explicitly on missing data. Add a dead man's switch, which is an alert that fires continuously to an external service, and that service pages someone if the signal ever stops.\u003c/p>\u003cp>Dashboards have their own failure mode. Teams accumulate dozens that nobody opens until an \u003ca href=\"#Incident\" data-term=\"Incident\">incident\u003c/a>, when nobody knows which one matters. A small set of service dashboards built around the \u003ca href=\"#Golden%20signals\" data-term=\"Golden signals\">golden signals\u003c/a> gives \u003ca href=\"#On-call\" data-term=\"On-call\">on-call\u003c/a> engineers a consistent place to start.\u003c/p>\u003cp>Monitoring covers only the failure modes someone thought to measure. \u003ca href=\"#Observability\" data-term=\"Observability\">Observability\u003c/a> extends this to questions nobody anticipated. The two work together: monitoring reports that something is wrong, and observability helps explain why.\u003c/p>","avoid":"","usage":["The checkout graph was flat all night, so I assumed things were quiet.","Flat at zero means the exporter died. Add an alert on missing data so a silent gap pages someone."],"out":[35,17,33,41,28,39,12]},{"name":"Telemetry","section":1,"description":"The data a running system emits about its own behaviour, such as logs, metrics, traces and profiles.","body":"\u003cp>Telemetry is the data a running system emits about its own behaviour. Engineers use it to understand production without attaching a debugger to live machines. The common signals differ in what they record and what makes them expensive:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Signal\u003c/th>\u003cth>Records\u003c/th>\u003cth>Useful for\u003c/th>\u003cth>Cost driver\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Metric\" data-term=\"Metric\">Metrics\u003c/a>\u003c/td>\u003ctd>Numbers over time\u003c/td>\u003ctd>Trends and \u003ca href=\"#Alert\" data-term=\"Alert\">alerts\u003c/a>\u003c/td>\u003ctd>Label combinations, or \u003ca href=\"#Cardinality\" data-term=\"Cardinality\">cardinality\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Log\" data-term=\"Log\">Logs\u003c/a>\u003c/td>\u003ctd>Individual events\u003c/td>\u003ctd>Detail on what happened\u003c/td>\u003ctd>Volume\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Distributed%20trace\" data-term=\"Distributed trace\">Traces\u003c/a>\u003c/td>\u003ctd>The path of one request\u003c/td>\u003ctd>Where time went across services\u003c/td>\u003ctd>\u003ca href=\"#Span\" data-term=\"Span\">Span\u003c/a> volume, unless \u003ca href=\"#Sampling\" data-term=\"Sampling\">sampled\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Profiles, from \u003ca href=\"#Profiling\" data-term=\"Profiling\">profiling\u003c/a>\u003c/td>\u003ctd>Where code spends resources\u003c/td>\u003ctd>Finding expensive functions\u003c/td>\u003ctd>Sample frequency and retention\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Telemetry passes through a pipeline. Code is instrumented to emit it, an agent or collector gathers it, a processing stage filters and aggregates it, and a backend stores it for queries. Each stage can delay, drop or alter data.\u003c/p>\u003cp>Two problems are common. The first is cost: the \u003ca href=\"#Observability\" data-term=\"Observability\">observability\u003c/a> bill grows faster than traffic because someone added a high-cardinality label or left debug logging on in production. The second is that telemetry degrades when it is needed. During an \u003ca href=\"#Incident\" data-term=\"Incident\">incident\u003c/a>, error logs surge, the pipeline backs up, and data from the relevant minutes arrives late or gets dropped. Buffering, rate limits on noisy sources and infrastructure separate from the observed systems all reduce this risk.\u003c/p>\u003cp>Telemetry can also leak sensitive data. Tokens, email addresses and payment details end up in log lines and span attributes when code records whole objects. Remove them at the source and again in the collector, because deleting data from retained stores is harder than never sending it.\u003c/p>\u003cp>Decide what to collect from the questions you need to answer. Data that no dashboard, alert or investigation uses is only a cost. \u003ca href=\"#OpenTelemetry\" data-term=\"OpenTelemetry\">OpenTelemetry\u003c/a> provides a common format for producing and shipping these signals.\u003c/p>","avoid":"","usage":["Why did the observability bill double this month?","Someone left debug logging on in the payments service. That one change accounts for most of the ingested telemetry."],"out":[17,35,22,15,23,24,26,56,12,41,27]},{"name":"Log","section":1,"description":"A timestamped record of a single event in a running system, read later to reconstruct what happened.","body":"\u003cp>A log is a timestamped record of a single event in a running system, such as a request handled, a job failed or a connection closed. Logs carry more detail per event than other kinds of \u003ca href=\"#Telemetry\" data-term=\"Telemetry\">telemetry\u003c/a>, and they are often the first place an engineer looks when a specific request went wrong.\u003c/p>\u003cp>Log lines are usually tagged with a level. Names vary by framework:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Typical production handling\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>DEBUG\u003c/td>\u003ctd>Detail for developers\u003c/td>\u003ctd>Off, or enabled briefly\u003c/td>\u003c/tr>\u003ctr>\u003ctd>INFO\u003c/td>\u003ctd>Normal events\u003c/td>\u003ctd>Kept, sometimes reduced\u003c/td>\u003c/tr>\u003ctr>\u003ctd>WARN\u003c/td>\u003ctd>Unexpected but handled\u003c/td>\u003ctd>Reviewed for trends\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ERROR\u003c/td>\u003ctd>An operation failed\u003c/td>\u003ctd>Investigated\u003c/td>\u003c/tr>\u003ctr>\u003ctd>FATAL\u003c/td>\u003ctd>The process cannot continue\u003c/td>\u003ctd>Investigated at once\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Logs are priced by volume, so small changes add up. One 500-byte line per request at 1,000 requests per second is 500 KB per second, or 43.2 GB per day. Adding a log line to a frequently called code path can raise the bill noticeably, and it can slow the service if writes happen synchronously.\u003c/p>\u003cp>Logs also fail in specific ways during an \u003ca href=\"#Incident\" data-term=\"Incident\">incident\u003c/a>. A broken dependency can produce one error line per request and bury everything else. A process that crashes may lose its buffered lines, so the entry explaining the crash was never written. Files on a container's local disk disappear when the container is replaced, so ship logs off the host.\u003c/p>\u003cp>Free-text lines are hard to query across many machines, which \u003ca href=\"#Structured%20logging\" data-term=\"Structured logging\">structured logging\u003c/a> addresses. Including a \u003ca href=\"#Distributed%20trace\" data-term=\"Distributed trace\">distributed trace\u003c/a> ID connects each line to its request. Never write secrets, tokens or personal data to logs.\u003c/p>\u003cp>Use logs to explain individual events. To count how often something happens, use a \u003ca href=\"#Metric\" data-term=\"Metric\">metric\u003c/a>, which stays cheap at any traffic level.\u003c/p>","avoid":"","usage":["The pod crashed and the last log line is from two minutes earlier.","Output is buffered, and it was killed for exceeding its memory limit before flushing. Check the container's exit reason instead."],"out":[14,41,16,23,17]},{"name":"Structured logging","section":1,"description":"Writing log events as named fields, usually JSON, so they can be filtered and aggregated without regex parsing.","body":"\u003cp>Structured logging is writing each \u003ca href=\"#Log\" data-term=\"Log\">log\u003c/a> event as a set of named fields, usually JSON, instead of a free-text sentence. Because fields have names and types, a log system can filter and aggregate them without parsing the text.\u003c/p>\u003cp>Here is the same event written both ways:\u003c/p>\u003cpre>\u003ccode>2026-03-14 10:02:11 ERROR payment failed for user 4821 after 3 retries (timeout)\u003c/code>\u003c/pre>\u003cpre>\u003ccode>{&quot;ts&quot;:&quot;2026-03-14T10:02:11Z&quot;,&quot;level&quot;:&quot;error&quot;,&quot;event&quot;:&quot;payment_failed&quot;,&quot;user_id&quot;:4821,&quot;retries&quot;:3,&quot;reason&quot;:&quot;timeout&quot;}\u003c/code>\u003c/pre>\u003cp>The free-text form works until someone needs an answer across millions of lines. During an outage, an engineer writes a regex to count failures, and it silently misses half of them because another developer phrased the message differently. A small wording change can also break a saved query or dashboard with no error. With fields, the same question is a filter on \u003ccode>reason\u003c/code> grouped by \u003ccode>user_id\u003c/code>.\u003c/p>\u003cp>A few conventions keep structured logs useful:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Practice\u003c/th>\u003cth>Reason\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Use a stable event name\u003c/td>\u003ctd>Queries survive changes to message wording\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Share field names across services\u003c/td>\u003ctd>\u003ccode>user_id\u003c/code> everywhere, not \u003ccode>uid\u003c/code> in one service\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Keep field types consistent\u003c/td>\u003ctd>A field that is sometimes a number and sometimes a string breaks indexing in many backends\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Include the trace ID\u003c/td>\u003ctd>Connects each line to its \u003ca href=\"#Distributed%20trace\" data-term=\"Distributed trace\">distributed trace\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Index only fields you query\u003c/td>\u003ctd>High-\u003ca href=\"#Cardinality\" data-term=\"Cardinality\">cardinality\u003c/a> indexes are expensive\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Structured logs are larger per line because field names repeat, though they compress well.\u003c/p>\u003cp>Some teams extend this into wide events: one rich record per request holding everything known about it. That approach supports \u003ca href=\"#Observability\" data-term=\"Observability\">observability\u003c/a> well. Choose fields deliberately in either case, because logging a whole request object is a common way to leak passwords and personal data into \u003ca href=\"#Telemetry\" data-term=\"Telemetry\">telemetry\u003c/a>.\u003c/p>","avoid":"","usage":["My grep found 200 timeouts, but the payment team counted 900.","Half the services word that message differently. Once they all emit structured logging with a reason field, we'll get one number."],"out":[15,23,22,12,14]},{"name":"Metric","section":1,"description":"A numeric measurement recorded over time, cheap to store and query, used for dashboards, trends and alerts.","body":"\u003cp>A metric is a numeric measurement of a system recorded over time. Each metric has a name and a set of labels, and every distinct combination of label values forms its own time series of timestamped numbers:\u003c/p>\u003cpre>\u003ccode>http_requests_total{method=&quot;GET&quot;, route=&quot;/checkout&quot;, status=&quot;500&quot;} 1027\u003c/code>\u003c/pre>\u003cp>Three metric types cover most needs:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Behaviour\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Counter\" data-term=\"Counter\">Counter\u003c/a>\u003c/td>\u003ctd>Only goes up, resets on restart\u003c/td>\u003ctd>Requests served\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Gauge\" data-term=\"Gauge\">Gauge\u003c/a>\u003c/td>\u003ctd>Goes up and down\u003c/td>\u003ctd>Memory in use\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Histogram\" data-term=\"Histogram\">Histogram\u003c/a>\u003c/td>\u003ctd>Counts values into buckets\u003c/td>\u003ctd>Request duration\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Metrics are cheap because storage grows with the number of time series and not with traffic. A counter takes the same space at 10 requests per second as at 10,000. That makes metrics suitable for \u003ca href=\"#Alert\" data-term=\"Alert\">alerts\u003c/a> and for trends over months.\u003c/p>\u003cp>The saving comes from discarding detail. A metric can report that 2% of requests failed, but not which requests. A breakdown is only possible if the label already exists. A common symptom is an \u003ca href=\"#Incident\" data-term=\"Incident\">incident\u003c/a> affecting one large customer that no graph can show, because customer is not a label. Adding customer ID as a label is usually the wrong fix because of \u003ca href=\"#Cardinality\" data-term=\"Cardinality\">cardinality\u003c/a>. Per-request detail belongs in \u003ca href=\"#Log\" data-term=\"Log\">logs\u003c/a> or \u003ca href=\"#Distributed%20trace\" data-term=\"Distributed trace\">distributed traces\u003c/a>.\u003c/p>\u003cp>Metrics reach storage by being pulled or pushed. Prometheus, for example, scrapes an endpoint on an interval, while other systems receive pushed data. Either way, resolution limits what you can see: a value sampled every 60 seconds cannot show a 5-second spike.\u003c/p>\u003cp>Aggregation needs care. Averages hide outliers, so latency is better read through \u003ca href=\"#Percentile\" data-term=\"Percentile\">percentiles\u003c/a> calculated from histograms. Put the unit in the metric name, as in \u003ccode>request_duration_seconds\u003c/code>, so nobody compares milliseconds with seconds on one graph.\u003c/p>","avoid":"","usage":["Can you show me error rate for just the Acme account?","Not from this metric, there's no customer label and we can't add one at that cardinality. Filter the traces by account instead."],"out":[18,19,20,35,41,22,15,23,21]},{"name":"Counter","section":1,"description":"A metric that only increases, such as total requests served, and is read as a rate of change over time.","body":"\u003cp>A counter is a \u003ca href=\"#Metric\" data-term=\"Metric\">metric\u003c/a> whose value only increases, apart from resetting to zero when the process restarts. Requests served, errors returned and bytes sent are typical counters.\u003c/p>\u003cp>The raw value is rarely useful, because &quot;1,204,331 requests since start&quot; says little about the present. Counters are read as a rate: take the change over a window and divide by the window's length. A counter that moves from 1,000 to 1,600 over 60 seconds is running at 10 per second.\u003c/p>\u003cp>Restarts need handling, as this hypothetical series shows:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Time\u003c/th>\u003cth>Raw value\u003c/th>\u003cth>What happened\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0 s\u003c/td>\u003ctd>1,000\u003c/td>\u003ctd>Normal\u003c/td>\u003c/tr>\u003ctr>\u003ctd>15 s\u003c/td>\u003ctd>1,150\u003c/td>\u003ctd>150 new events\u003c/td>\u003c/tr>\u003ctr>\u003ctd>30 s\u003c/td>\u003ctd>40\u003c/td>\u003ctd>Process restarted, counted 40\u003c/td>\u003c/tr>\u003ctr>\u003ctd>45 s\u003c/td>\u003ctd>190\u003c/td>\u003ctd>150 new events\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Plain subtraction between 15 s and 30 s gives -1,110, which appears on a graph as a sharp negative spike. Query functions built for counters, such as \u003ccode>rate()\u003c/code> in Prometheus, treat any drop as a reset and count the 40 as new events. Increments made between the last scrape and the crash are still lost.\u003c/p>\u003cp>A counter tolerates missed scrapes better than a \u003ca href=\"#Gauge\" data-term=\"Gauge\">gauge\u003c/a> reporting a current rate. If one sample is lost, the next still includes every increment since, so the total over the window stays correct. This is why event counts are stored as counters.\u003c/p>\u003cp>Counters have a less obvious failure with new label values. If a series for \u003ccode>status=&quot;500&quot;\u003c/code> does not exist until the first error, there is no earlier sample to compare it with, and \u003ccode>rate()\u003c/code> misses that first increment. An \u003ca href=\"#Alert\" data-term=\"Alert\">alert\u003c/a> on rare errors may then stay silent. Initialise known label combinations to zero at startup.\u003c/p>","avoid":"","usage":["The error graph dropped to minus a thousand at 14:05.","Someone graphed a raw delta on a counter and the pod restarted. Use rate so resets are handled."],"out":[17,19,35]},{"name":"Gauge","section":1,"description":"A metric that can rise or fall, reporting a current value such as memory in use, queue depth or open connections.","body":"\u003cp>A gauge is a \u003ca href=\"#Metric\" data-term=\"Metric\">metric\u003c/a> that reports a current value, which can rise or fall. Memory in use, queue depth, open connections and temperature are typical gauges. Reading one tells you the level at that moment.\u003c/p>\u003cp>It differs from a \u003ca href=\"#Counter\" data-term=\"Counter\">counter\u003c/a> in several ways:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Aspect\u003c/th>\u003cth>Gauge\u003c/th>\u003cth>Counter\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Direction\u003c/td>\u003ctd>Up and down\u003c/td>\u003ctd>Up only, except on reset\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Read as\u003c/td>\u003ctd>Current value\u003c/td>\u003ctd>Rate of change\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Example\u003c/td>\u003ctd>37 messages queued\u003c/td>\u003ctd>1,204 messages processed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Missed sample\u003c/td>\u003ctd>That moment's value is lost\u003c/td>\u003ctd>Next sample still has the increments\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The weakness of a gauge is that it is only seen when sampled. A scraper recording every 15 seconds knows nothing about the values in between. A memory spike lasting three seconds may never appear on the graph even if it got the process killed, which produces a familiar confusion: an out-of-memory crash on a chart that shows plenty of headroom. Where available, record a peak value since the last scrape, and check the container's exit reason.\u003c/p>\u003cp>Aggregating gauges takes thought. Averaging memory across instances hides the one about to crash, so graph the maximum as well.\u003c/p>\u003cp>Gauges are the usual way to measure \u003ca href=\"#Saturation\" data-term=\"Saturation\">saturation\u003c/a>: connections in use against pool size, disk used, queue length. For resources that fill up, \u003ca href=\"#Alert\" data-term=\"Alert\">alert\u003c/a> on the trend. A prediction that a disk will fill within four hours is more useful than a fixed 90% threshold, which leaves 1 TB free on a 10 TB disk and 10 GB on a 100 GB disk.\u003c/p>\u003cp>Do not apply a counter function such as Prometheus \u003ccode>rate()\u003c/code> to a gauge. It reads every dip as a reset and returns wrong values. Use \u003ccode>deriv()\u003c/code> or \u003ccode>delta()\u003c/code> instead.\u003c/p>","avoid":"","usage":["Memory never went above 70% on the dashboard, but the pod got OOM-killed.","That gauge is scraped every 30 seconds, so it can miss a short spike. Check the peak from the container stats."],"out":[17,18,31,35]},{"name":"Histogram","section":1,"description":"A metric that counts observations into value buckets, so percentiles can be estimated and combined across instances.","body":"\u003cp>A histogram is a \u003ca href=\"#Metric\" data-term=\"Metric\">metric\u003c/a> that counts observations into buckets by value. Request duration is the usual example: each request increments the bucket covering how long it took. Keeping counts instead of every value lets you estimate a \u003ca href=\"#Percentile\" data-term=\"Percentile\">percentile\u003c/a> at a fixed storage cost.\u003c/p>\u003cp>Here is a hypothetical histogram of 1,000 requests, using cumulative buckets as Prometheus does:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Bucket (at or under)\u003c/th>\u003cth>Cumulative count\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>100 ms\u003c/td>\u003ctd>900\u003c/td>\u003c/tr>\u003ctr>\u003ctd>250 ms\u003c/td>\u003ctd>980\u003c/td>\u003c/tr>\u003ctr>\u003ctd>500 ms\u003c/td>\u003ctd>995\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1,000 ms\u003c/td>\u003ctd>1,000\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>To estimate p99, find request number 990, which falls in the 250 to 500 ms bucket. Linear interpolation gives 250 + ((990 - 980) / (995 - 980)) x 250, or about 417 ms. The true value could be anywhere from 250 to 500 ms, so bucket boundaries set the accuracy.\u003c/p>\u003cp>Poorly chosen buckets produce a recognisable symptom. If more than 1% of requests exceed the highest finite boundary, the reported p99 flatlines at that boundary, even as real latency keeps climbing. Choose boundaries that cover both normal and failing behaviour, and place one at your \u003ca href=\"#SLO\" data-term=\"SLO\">SLO\u003c/a> threshold so the count of good requests is exact.\u003c/p>\u003cp>Histograms can be combined across instances by adding counts bucket by bucket, provided the boundaries match. Percentiles already calculated on each instance cannot be merged in this way.\u003c/p>\u003cp>Each bucket is its own time series, multiplied by every label combination, which makes histograms a common source of \u003ca href=\"#Cardinality\" data-term=\"Cardinality\">cardinality\u003c/a> growth. In the classic Prometheus format, 12 buckets across 1,000 label combinations produce 12,000 series, plus 2,000 more for each combination's sum and count. Native Prometheus histograms and \u003ca href=\"#OpenTelemetry\" data-term=\"OpenTelemetry\">OpenTelemetry\u003c/a> exponential histograms choose their buckets automatically, which reduces this cost.\u003c/p>","avoid":"","usage":["p99 has sat at exactly 10 seconds since the \u003ca href=\"#Incident\" data-term=\"Incident\">incident\u003c/a> started. Suspicious, right?","10 is our top histogram bucket. Everything slower lands in the overflow bucket, so real latency could be much higher."],"out":[17,21,4,22,27,41]},{"name":"Percentile","section":1,"description":"The value below which a given share of measurements fall. A p99 of 800 ms means 99% of requests took 800 ms or less.","body":"\u003cp>A percentile is the value at or below which a given share of measurements fall. Latency is commonly reported as p50 (the median), p95 and p99. A p99 of 800 ms means 99% of requests took 800 ms or less and 1% took longer.\u003c/p>\u003cp>Percentiles are used because averages hide the shape of a distribution. Take 100 hypothetical requests, where 98 take 100 ms and 2 take 10,000 ms:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Statistic\u003c/th>\u003cth>Value\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Mean\u003c/td>\u003ctd>298 ms\u003c/td>\u003c/tr>\u003ctr>\u003ctd>p50\u003c/td>\u003ctd>100 ms\u003c/td>\u003c/tr>\u003ctr>\u003ctd>p95\u003c/td>\u003ctd>100 ms\u003c/td>\u003c/tr>\u003ctr>\u003ctd>p99\u003c/td>\u003ctd>10,000 ms\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The mean of 298 ms describes no real request. This is the situation behind a dashboard showing a healthy average while users report timeouts: the slow requests are real, but the average dilutes them.\u003c/p>\u003cp>Percentiles cannot be averaged. If one instance has a p99 of 100 ms and another has 900 ms, the combined p99 is not 500 ms. It depends on how much traffic each handled and on the full distributions. The same error occurs when per-minute p99s are averaged into an hourly figure. To get a correct result, merge the underlying \u003ca href=\"#Histogram\" data-term=\"Histogram\">histograms\u003c/a> and calculate the percentile from the combined counts.\u003c/p>\u003cp>Sample size limits what a percentile can tell you. With 50 requests in a window, p99 is effectively the single slowest request, so the line jumps around at low traffic. Check the request count before reacting to a spike.\u003c/p>\u003cp>A high percentile also affects more users than its number suggests. If a page makes 20 independent requests, the chance that at least one is slower than p99 is 1 - 0.99^20, or about 18%. This effect is a main reason to care about \u003ca href=\"#Tail%20latency\" data-term=\"Tail latency\">tail latency\u003c/a>, and why an \u003ca href=\"#SLI\" data-term=\"SLI\">SLI\u003c/a> for latency is usually defined by a threshold or percentile.\u003c/p>","avoid":"","usage":["Average latency is 120 ms. I don't see what customers are complaining about.","Look at p99, it's over four seconds. The average is hiding the slowest one in a hundred requests."],"out":[20,32,3]},{"name":"Cardinality","section":1,"description":"The number of distinct values a field can take. For metrics, the number of time series, which drives cost and query speed.","body":"\u003cp>Cardinality is the number of distinct values a field can take. For a \u003ca href=\"#Metric\" data-term=\"Metric\">metric\u003c/a>, it usually means the number of distinct time series, because each unique combination of label values is stored and indexed separately.\u003c/p>\u003cp>Labels multiply. Here is how a hypothetical request metric grows as labels are added:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Label added\u003c/th>\u003cth>Distinct values\u003c/th>\u003cth>Possible series\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>method\u003c/td>\u003ctd>5\u003c/td>\u003ctd>5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>route\u003c/td>\u003ctd>20\u003c/td>\u003ctd>100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>status\u003c/td>\u003ctd>6\u003c/td>\u003ctd>600\u003c/td>\u003c/tr>\u003ctr>\u003ctd>instance\u003c/td>\u003ctd>50\u003c/td>\u003ctd>30,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>user_id\u003c/td>\u003ctd>100,000\u003c/td>\u003ctd>3,000,000,000\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The last row is an upper bound, since not every user hits every route on every instance. Even a small fraction of it is far more than the first four labels produce.\u003c/p>\u003cp>The symptom is a metrics bill that jumps after a harmless-looking one-line change, or a metrics server that runs out of memory and takes \u003ca href=\"#Monitoring\" data-term=\"Monitoring\">monitoring\u003c/a> down with it. Common causes are user IDs, request IDs, full URLs containing IDs, raw error messages and timestamps used as label values. Pod names add churn, because each rollout creates new names and therefore new series.\u003c/p>\u003cp>Several fixes apply:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fix\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Use route templates\u003c/td>\u003ctd>\u003ccode>/users/:id\u003c/code> in place of \u003ccode>/users/4821\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Group values\u003c/td>\u003ctd>\u003ccode>5xx\u003c/code> in place of each status code\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Drop labels\u003c/td>\u003ctd>Remove them in the collection pipeline\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Set limits\u003c/td>\u003ctd>Reject or cap series per service\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Move the detail\u003c/td>\u003ctd>Put per-user data in \u003ca href=\"#Log\" data-term=\"Log\">lo
