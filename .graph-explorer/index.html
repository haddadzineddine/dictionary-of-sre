gs\u003c/a> or \u003ca href=\"#Distributed%20trace\" data-term=\"Distributed trace\">traces\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A \u003ca href=\"#Histogram\" data-term=\"Histogram\">histogram\u003c/a> multiplies the count again, because each bucket is its own series.\u003c/p>\u003cp>High cardinality is not bad in itself. Asking &quot;which customer is affected?&quot; requires a customer ID somewhere, and that detail supports \u003ca href=\"#Observability\" data-term=\"Observability\">observability\u003c/a>. The question is where to store it. Time-series databases handle it poorly, while log and trace stores are built for it.\u003c/p>","avoid":"","usage":["Prometheus got OOM-killed right after the last deploy.","Someone added the full request path as a label. Every order ID became a new series, so that's a cardinality explosion."],"out":[17,13,15,23,20,12]},{"name":"Distributed trace","section":1,"description":"A record of one request's path through multiple services, shown as a tree of timed spans.","body":"\u003cp>A distributed trace is a record of one request's path through the services that handled it. It is made of \u003ca href=\"#Span\" data-term=\"Span\">spans\u003c/a>, each representing a timed operation, joined by a shared trace ID into a tree.\u003c/p>\u003cp>A trace view for a hypothetical slow checkout looks like this:\u003c/p>\u003cpre>\u003ccode>POST /checkout       [==============================] 820 ms\n  auth.verify        [==]                              40 ms\n  cart.load             [===]                          60 ms\n  payment.charge            [======================]  640 ms\n    fraud.score             [==================]      520 ms\u003c/code>\u003c/pre>\u003cp>The tree answers a question that per-service dashboards struggle with. When a request is slow and it crosses twelve services, each team can look at its own graphs, see nothing unusual and conclude the problem is elsewhere. Here the trace shows that checkout is slow because the payment step spends most of its time waiting on fraud scoring.\u003c/p>\u003cp>Traces also expose patterns that are hard to see in aggregate. Calls that could run in parallel appear one after another. Retries show up as repeated spans. The N+1 query problem, where code runs one query per item in a list, appears as a long staircase of identical database spans.\u003c/p>\u003cp>Tracing depends on every service in the path. Each must be instrumented and must forward the trace ID through \u003ca href=\"#Context%20propagation\" data-term=\"Context propagation\">context propagation\u003c/a>. If one service in the middle does not, the trace splits into disconnected fragments. Unexplained gaps in a timeline usually mean uninstrumented work, such as time spent waiting in a queue.\u003c/p>\u003cp>Storing every trace is expensive, so most systems use \u003ca href=\"#Sampling\" data-term=\"Sampling\">sampling\u003c/a>. The consequence is that the trace for the specific failed request you are investigating may not have been kept. A trace explains one request, so use a \u003ca href=\"#Metric\" data-term=\"Metric\">metric\u003c/a> to find out how common the behaviour is. \u003ca href=\"#OpenTelemetry\" data-term=\"OpenTelemetry\">OpenTelemetry\u003c/a> is the common standard for producing traces.\u003c/p>","avoid":"","usage":["Search is slow but the search service's own latency looks flat.","Pull a distributed trace for a slow request. I'd bet the time is going to the ranking call before search even starts."],"out":[24,25,26,17,27]},{"name":"Span","section":1,"description":"One named, timed operation inside a distributed trace, such as an HTTP call or a database query.","body":"\u003cp>A span is one named, timed operation within a \u003ca href=\"#Distributed%20trace\" data-term=\"Distributed trace\">distributed trace\u003c/a>, such as handling an HTTP request, calling another service or running a database query. Spans point to their parent, and those references form the tree of the trace.\u003c/p>\u003cp>A span typically holds these fields:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Field\u003c/th>\u003cth>Purpose\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Trace ID\u003c/td>\u003ctd>Groups spans into one trace\u003c/td>\u003ctd>\u003ccode>4bf92f35...\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Span ID\u003c/td>\u003ctd>Identifies this span\u003c/td>\u003ctd>\u003ccode>00f067aa...\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Parent span ID\u003c/td>\u003ctd>Places it in the tree\u003c/td>\u003ctd>The caller's span ID\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Name\u003c/td>\u003ctd>Describes the operation\u003c/td>\u003ctd>\u003ccode>GET /users/:id\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Start and end\u003c/td>\u003ctd>Give the duration\u003c/td>\u003ctd>120 ms\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Attributes\u003c/td>\u003ctd>Key-value context\u003c/td>\u003ctd>\u003ccode>http.response.status_code=500\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Status\u003c/td>\u003ctd>Records the outcome\u003c/td>\u003ctd>Error\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Events\u003c/td>\u003ctd>Timestamped notes in the span\u003c/td>\u003ctd>An exception was recorded\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A remote call usually produces two spans: a client span in the caller and a server span in the callee. Comparing them is a useful diagnostic. If the client span takes 120 ms and the server span takes 40 ms, the other 80 ms went somewhere outside the handler, such as the network, waiting for a connection, or a queue in front of the server. This explains the common disagreement where the called team's dashboard shows fast responses while the calling team sees slow ones.\u003c/p>\u003cp>Keep span names low in \u003ca href=\"#Cardinality\" data-term=\"Cardinality\">cardinality\u003c/a>. Backends group by name, so use \u003ccode>GET /users/:id\u003c/code> and place the actual ID in an attribute.\u003c/p>\u003cp>A span per network call plus any significant internal step is a common default.\u003c/p>\u003cp>Spans must be ended explicitly in most SDKs, and a span is generally exported only once it ends. Code that forgets to end a span on an error path loses it, so the failing operation is missing from the trace. Close spans in a \u003ccode>finally\u003c/code> block or its equivalent.\u003c/p>","avoid":"","usage":["Our server span says 30 ms, but the frontend team swears the call takes 400.","Compare it with their client span. A gap that size is usually connection pool wait or a queue in front of us."],"out":[23,22]},{"name":"Context propagation","section":1,"description":"Passing trace identifiers and related metadata across process boundaries so separate spans join into one trace.","body":"\u003cp>Context propagation is the passing of trace identifiers and related metadata from one operation to the next, so that work done in separate services joins the same \u003ca href=\"#Distributed%20trace\" data-term=\"Distributed trace\">distributed trace\u003c/a>. Without it, each service records its own disconnected fragment.\u003c/p>\u003cp>Over HTTP, the W3C Trace Context standard carries this in a \u003ccode>traceparent\u003c/code> header:\u003c/p>\u003cpre>\u003ccode>traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01\u003c/code>\u003c/pre>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Field\u003c/th>\u003cth>Value in the example\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Version\u003c/td>\u003ctd>\u003ccode>00\u003c/code>\u003c/td>\u003ctd>Format version\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Trace ID\u003c/td>\u003ctd>\u003ccode>4bf92f35...\u003c/code>\u003c/td>\u003ctd>32 hex characters, shared by the trace\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Parent ID\u003c/td>\u003ctd>\u003ccode>00f067aa...\u003c/code>\u003c/td>\u003ctd>16 hex characters, the caller's \u003ca href=\"#Span\" data-term=\"Span\">span\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Flags\u003c/td>\u003ctd>\u003ccode>01\u003c/code>\u003c/td>\u003ctd>The sampled bit is set\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Each service reads the incoming header, starts a child span and writes that span's ID into its outgoing calls. A companion \u003ccode>tracestate\u003c/code> header carries vendor-specific data.\u003c/p>\u003cp>The symptom of broken propagation is a trace that stops after two services, or a downstream service appearing as its own unrelated trace. Common causes are a proxy that strips unknown headers, a hand-written HTTP client that does not forward them, and message queues where the producer does not write context into message headers. Context can also be lost inside one process, because libraries hold the current span in thread-local or async-local storage, and work handed to a thread pool may not carry it along.\u003c/p>\u003cp>Propagation also carries the \u003ca href=\"#Sampling\" data-term=\"Sampling\">sampling\u003c/a> decision, so every service keeps or drops a trace together.\u003c/p>\u003cp>Baggage is a related mechanism for application-defined key-value data that travels with the context. It is sent to every downstream service, possibly including third parties, so keep secrets and personal data out of it. Services at a public edge should generally start a new trace instead of trusting incoming headers.\u003c/p>","avoid":"","usage":["The trace ends at the order service, then nothing, even though the worker clearly ran.","Context propagation breaks at the queue. The producer isn't writing traceparent into the message headers."],"out":[23,24,26]},{"name":"Sampling","section":1,"description":"Keeping only a subset of telemetry, usually traces, to control cost while retaining enough data to investigate problems.","body":"\u003cp>Sampling is keeping a subset of \u003ca href=\"#Telemetry\" data-term=\"Telemetry\">telemetry\u003c/a> and discarding the rest to control cost. It is applied mainly to \u003ca href=\"#Distributed%20trace\" data-term=\"Distributed trace\">distributed traces\u003c/a> and also to high-volume \u003ca href=\"#Log\" data-term=\"Log\">logs\u003c/a>.\u003c/p>\u003cp>The common strategies differ in when they decide:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Strategy\u003c/th>\u003cth>Decides\u003c/th>\u003cth>Keeps\u003c/th>\u003cth>Trade-off\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Head-based\u003c/td>\u003ctd>At the start of a request\u003c/td>\u003ctd>A fixed random share\u003c/td>\u003ctd>Cheap, but blind to the outcome\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tail-based\u003c/td>\u003ctd>After the trace completes\u003c/td>\u003ctd>Errors, slow traces, a random baseline\u003c/td>\u003ctd>Must buffer all \u003ca href=\"#Span\" data-term=\"Span\">spans\u003c/a> until it decides\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rate-limited\u003c/td>\u003ctd>As requests arrive\u003c/td>\u003ctd>Up to a fixed number per second\u003c/td>\u003ctd>Bounded cost, but the kept share varies with traffic\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Head-based sampling loses rare failures. Take a hypothetical service handling 2,000 requests per second with a 0.1% error rate, which is 2 failures per second. Sampling 1% keeps 20 traces per second, of which on average 0.02 are failures, or about one failed trace every 50 seconds. The symptom is searching for a customer's failed request ID and finding that no trace was kept.\u003c/p>\u003cp>Tail-based sampling addresses this at a cost. A collector must hold the spans of in-flight traces in memory, and all spans of a trace must reach the same collector instance.\u003c/p>\u003cp>Decisions need to be consistent across services. The decision is normally made once and passed along by \u003ca href=\"#Context%20propagation\" data-term=\"Context propagation\">context propagation\u003c/a>. If two services each sampled 10% independently, only about 1% of traces would be complete.\u003c/p>\u003cp>Sampled data also needs reweighting when counted. At 1-in-100, each kept trace stands for 100 requests, so raw counts understate traffic. Compute error rates and \u003ca href=\"#SLO\" data-term=\"SLO\">SLO\u003c/a> performance from unsampled \u003ca href=\"#Metric\" data-term=\"Metric\">metrics\u003c/a>, and use sampled traces to explain individual behaviour.\u003c/p>","avoid":"","usage":["The customer gave us a request ID, but there's no trace for it.","We head-sample at 1%, so it probably got dropped. Let's move to tail sampling so errors are always kept."],"out":[14,23,15,24,25,4,17]},{"name":"OpenTelemetry","section":1,"description":"An open, vendor-neutral standard and toolset for producing, collecting and exporting traces, metrics and logs.","body":"\u003cp>OpenTelemetry (OTel) is an open-source, vendor-neutral standard and set of tools for producing, collecting and exporting \u003ca href=\"#Telemetry\" data-term=\"Telemetry\">telemetry\u003c/a>. It covers \u003ca href=\"#Distributed%20trace\" data-term=\"Distributed trace\">distributed traces\u003c/a>, \u003ca href=\"#Metric\" data-term=\"Metric\">metrics\u003c/a> and \u003ca href=\"#Log\" data-term=\"Log\">logs\u003c/a>. It is a Cloud Native Computing Foundation project, formed in 2019 by merging OpenTracing and OpenCensus. OTel does not store or display data. You send its output to a backend such as Jaeger, Prometheus or a commercial vendor.\u003c/p>\u003cp>The project is made of several parts:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Component\u003c/th>\u003cth>Role\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>API\u003c/td>\u003ctd>What application and library code calls to record telemetry\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SDK\u003c/td>\u003ctd>Implements the API, including \u003ca href=\"#Sampling\" data-term=\"Sampling\">sampling\u003c/a>, batching and export\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Instrumentation libraries\u003c/td>\u003ctd>Add telemetry to common frameworks without hand-written code\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OTLP\u003c/td>\u003ctd>The wire protocol for sending telemetry\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Collector\u003c/td>\u003ctd>A standalone service that receives, filters and forwards data\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Semantic conventions\u003c/td>\u003ctd>Standard attribute names, such as \u003ccode>http.request.method\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>OTel addresses vendor lock-in. When code calls one vendor's SDK throughout, changing vendor means re-instrumenting every service. With OTel, the instrumentation stays the same and the export destination changes in configuration. Shared naming and \u003ca href=\"#Context%20propagation\" data-term=\"Context propagation\">context propagation\u003c/a> also let services written in different languages join the same trace.\u003c/p>\u003cp>A Collector is commonly run in production because it separates applications from backends and gives one place to redact sensitive fields and apply sampling.\u003c/p>\u003cp>Adoption has some practical hazards. Signals and language SDKs mature at different rates, so check the stability status for your language. Automatic instrumentation can emit many \u003ca href=\"#Span\" data-term=\"Span\">spans\u003c/a>, some of them noise, and raise costs, so review what it produces. Semantic conventions have also changed over time. For example, \u003ccode>http.method\u003c/code> became \u003ccode>http.request.method\u003c/code>, so a dashboard built on the old name can go blank after an upgrade.\u003c/p>","avoid":"","usage":["If we switch tracing vendors, do we have to touch every service again?","Not if we instrument with OpenTelemetry. We'd change the Collector's exporter and leave the application code alone."],"out":[14,23,17,15,26,25,24]},{"name":"Golden signals","section":2,"description":"Four measurements for a user-facing service, from Google's SRE book. They are latency, traffic, errors and saturation.","body":"\u003cp>The golden signals are four measurements that Google's SRE book recommends for \u003ca href=\"#Monitoring\" data-term=\"Monitoring\">monitoring\u003c/a> a user-facing service: latency, traffic, errors and \u003ca href=\"#Saturation\" data-term=\"Saturation\">saturation\u003c/a>. If a team can measure only four things about a service, these give a reasonable picture of its health.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Signal\u003c/th>\u003cth>Question it answers\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Latency\u003c/td>\u003ctd>How long do requests take?\u003c/td>\u003ctd>p99 checkout duration\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Traffic\u003c/td>\u003ctd>How much demand is there?\u003c/td>\u003ctd>Requests per second\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Errors\u003c/td>\u003ctd>What share of requests fail?\u003c/td>\u003ctd>Rate of 5xx responses\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Saturation\u003c/td>\u003ctd>How full is the service?\u003c/td>\u003ctd>Connection pool in use, queue depth\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Latency should be split by outcome. A request that fails immediately is fast, so during an outage the latency graph can improve while users get nothing but errors. Track successful and failed requests separately, and read them as \u003ca href=\"#Percentile\" data-term=\"Percentile\">percentiles\u003c/a> instead of averages.\u003c/p>\u003cp>Errors include failures that do not look like errors. A 200 response with the wrong content is a failure, and so is a response slower than the service has committed to.\u003c/p>\u003cp>Traffic provides context for the others. A sudden drop often means a failure upstream, and the error rate can stay at zero throughout because no requests are arriving to fail. An error-rate graph alone will show that as a healthy service.\u003c/p>\u003cp>Saturation tends to lead the other three. It shows trouble building before users feel it, while latency and errors show what is affecting them now.\u003c/p>\u003cp>A common use is one dashboard per service with these four panels, which gives an \u003ca href=\"#On-call\" data-term=\"On-call\">on-call\u003c/a> engineer the same first view everywhere. \u003ca href=\"#Symptom-based%20alerting\" data-term=\"Symptom-based alerting\">Symptom-based alerting\u003c/a> usually pages on latency and errors. The \u003ca href=\"#RED%20method\" data-term=\"RED method\">RED method\u003c/a> is a narrower recipe for request-driven services, and the \u003ca href=\"#USE%20method\" data-term=\"USE method\">USE method\u003c/a> applies similar thinking to individual resources.\u003c/p>","avoid":"","usage":["Latency just got better across the board. Did someone ship a performance fix?","Check the other golden signals first. Errors tripled, so we're failing fast and those requests are dragging the numbers down."],"out":[13,31,21,39,37,29,30]},{"name":"RED method","section":2,"description":"A monitoring recipe for request-driven services that tracks rate, errors and duration for every service.","body":"\u003cp>The RED method is a \u003ca href=\"#Monitoring\" data-term=\"Monitoring\">monitoring\u003c/a> recipe for request-driven services: for each service, track Rate, Errors and Duration. Tom Wilkie proposed it as a simpler form of the \u003ca href=\"#Golden%20signals\" data-term=\"Golden signals\">golden signals\u003c/a>, leaving out \u003ca href=\"#Saturation\" data-term=\"Saturation\">saturation\u003c/a>.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Letter\u003c/th>\u003cth>Measures\u003c/th>\u003cth>Typical \u003ca href=\"#Metric\" data-term=\"Metric\">metric\u003c/a>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Rate\u003c/td>\u003ctd>Requests per second\u003c/td>\u003ctd>Rate of a \u003ca href=\"#Counter\" data-term=\"Counter\">counter\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Errors\u003c/td>\u003ctd>Failed requests per second\u003c/td>\u003ctd>The same counter, filtered by an error label\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Duration\u003c/td>\u003ctd>How long requests take\u003c/td>\u003ctd>\u003ca href=\"#Percentile\" data-term=\"Percentile\">Percentiles\u003c/a> from a \u003ca href=\"#Histogram\" data-term=\"Histogram\">histogram\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The benefit is consistency across services. Without a shared recipe, each team builds its own dashboards, and during an \u003ca href=\"#Incident\" data-term=\"Incident\">incident\u003c/a> nobody can read another team's graphs quickly. With RED, every service shows the same three panels, so an engineer can judge an unfamiliar service in seconds. A shared library or a service mesh, which is a network layer handling traffic between services, can emit these metrics automatically.\u003c/p>\u003cp>The three panels are most useful read together:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Pattern\u003c/th>\u003cth>Likely meaning\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Rate drops, errors flat\u003c/td>\u003ctd>Upstream failure or a routing problem\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Errors rise, duration falls\u003c/td>\u003ctd>Requests are failing fast\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Duration rises, rate steady\u003c/td>\u003ctd>Slow dependency or a resource limit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rate rises, then duration, then errors\u003c/td>\u003ctd>Overload\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Read errors against rate. Five failures per second is a serious problem at 50 requests per second and a small one at 5,000. \u003ca href=\"#Alert\" data-term=\"Alert\">Alerts\u003c/a> generally use the ratio.\u003c/p>\u003cp>RED has limits. It says which service is unhealthy but not which resource is responsible, which is the job of the \u003ca href=\"#USE%20method\" data-term=\"USE method\">USE method\u003c/a>. It also fits poorly with batch jobs and stream processors, which have no request to measure and are better judged by throughput and how far behind they are.\u003c/p>","avoid":"","usage":["I've never touched the inventory service. Where do I start?","Open its RED dashboard. If duration is up with a steady rate, look at what it calls before you look at its code."],"out":[13,28,31,17,18,21,20,41,35,30]},{"name":"USE method","section":2,"description":"A checklist from Brendan Gregg that examines utilisation, saturation and errors for every resource in a system.","body":"\u003cp>The USE method is a performance-analysis checklist created by Brendan Gregg: for every resource, check Utilisation, \u003ca href=\"#Saturation\" data-term=\"Saturation\">Saturation\u003c/a> and Errors. A resource is anything with finite capacity, including CPU, memory, disks and network interfaces, as well as software limits such as connection pools.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Letter\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>CPU example\u003c/th>\u003cth>Disk example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Utilisation\u003c/td>\u003ctd>Share of time the resource is busy\u003c/td>\u003ctd>85% busy\u003c/td>\u003ctd>Device busy 70% of the time\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Saturation\u003c/td>\u003ctd>Extra work waiting\u003c/td>\u003ctd>Run queue length\u003c/td>\u003ctd>I/O queue length\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Errors\u003c/td>\u003ctd>Count of error events\u003c/td>\u003ctd>Hardware CPU faults\u003c/td>\u003ctd>Read and write errors\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The method replaces guessing with a fixed walk through the system. When a service is slow, teams often restart it, or look only at whichever graphs already exist. Working through a list of resources covers the parts nobody thought to check.\u003c/p>\u003cp>Utilisation is easy to misread, and two cases come up repeatedly. A single-threaded process can max out one of 16 CPU cores while the host reports about 6% usage, so per-core figures matter. Averages also hide bursts: a CPU at 60% over a minute may have spent several seconds at 100% with work queued behind it.\u003c/p>\u003cp>Thread pools, file descriptors, connection pools and locks are often the actual limit. A pool of 20 connections with all 20 in use and callers waiting is saturated even when the machine looks idle.\u003c/p>\u003cp>USE complements the \u003ca href=\"#RED%20method\" data-term=\"RED method\">RED method\u003c/a>. RED looks at a service from the outside and shows whether it is healthy. USE looks at the resources underneath and shows what is limiting it. A common sequence is to use RED to find the unhealthy service, USE to find the constrained resource, and then \u003ca href=\"#Profiling\" data-term=\"Profiling\">profiling\u003c/a> if the constraint is CPU.\u003c/p>","avoid":"","usage":["Host CPU is only at 8%, so it can't be a compute problem.","Run through USE per core. That worker is single-threaded, and I'd expect one core pinned at 100% with a queue behind it."],"out":[31,29,56]},{"name":"Saturation","section":2,"description":"How close a resource is to its limit, including work that must wait because the resource is already busy.","body":"\u003cp>Saturation is how close a resource is to its limit and, past that point, how much work is waiting because the resource is busy. The \u003ca href=\"#Golden%20signals\" data-term=\"Golden signals\">golden signals\u003c/a> describe it as how full a service is. The \u003ca href=\"#USE%20method\" data-term=\"USE method\">USE method\u003c/a> defines it more narrowly as queued work the resource cannot yet serve.\u003c/p>\u003cp>Saturation differs from utilisation. A CPU that is 100% busy with nothing waiting is fully utilised but not saturated. The same CPU with 30 runnable threads waiting for a turn is saturated.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Resource\u003c/th>\u003cth>Utilisation\u003c/th>\u003cth>Saturation signal\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>CPU\u003c/td>\u003ctd>Percent busy\u003c/td>\u003ctd>Run queue length, throttled time\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Memory\u003c/td>\u003ctd>Percent used\u003c/td>\u003ctd>Swapping, reclaim, out-of-memory kills\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Connection pool\u003c/td>\u003ctd>Connections in use\u003c/td>\u003ctd>Callers waiting, wait time\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Message queue\u003c/td>\u003ctd>Not applicable\u003c/td>\u003ctd>Consumer lag, age of oldest message\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The symptom is latency that jumps sharply while traffic has risen only a little, with no errors in the \u003ca href=\"#Log\" data-term=\"Log\">logs\u003c/a> and CPU looking moderate. This happens because \u003ca href=\"#Queueing%20delay\" data-term=\"Queueing delay\">queueing delay\u003c/a> grows non-linearly near capacity. A database call that normally takes 5 ms can take 500 ms because it waited for a free connection, and the database's own slow-query record shows nothing, since the query itself was fast.\u003c/p>\u003cp>A container CPU limit is enforced over short periods, by default 100 ms on Linux, so a multi-threaded service can use its quota early in a period and then be paused for the rest. Average CPU looks comfortable while latency suffers. The throttled-time \u003ca href=\"#Metric\" data-term=\"Metric\">metric\u003c/a> shows it.\u003c/p>\u003cp>Measure waiting as well as usage. To respond, add capacity, reduce the work per request, or bound queues so excess requests are rejected quickly instead of waiting indefinitely. \u003ca href=\"#Capacity%20planning\" data-term=\"Capacity planning\">Capacity planning\u003c/a> aims to add resources before this point is reached.\u003c/p>","avoid":"","usage":["DB CPU is at 30% and queries are fast, but the API is timing out.","Check saturation on the connection pool. If all 50 are in use, requests are queueing before they ever reach the database."],"out":[28,30,15,52,17,47]},{"name":"Tail latency","section":2,"description":"The response time of the slowest small share of requests, read at high percentiles such as p99. Fan-out makes it more visible.","body":"\u003cp>Tail latency is the response time of the slowest small fraction of requests, usually reported as p99 or p99.9. The name comes from the shape of a latency distribution: most requests form a hump near the typical value, and a long thin tail stretches to the right. A \u003ca href=\"#Percentile\" data-term=\"Percentile\">percentile\u003c/a> is the standard way to measure it.\u003c/p>\u003cp>Fan-out makes the tail matter more than its size suggests. When one user request calls many backends in parallel and waits for all of them, it is as slow as the slowest. If each backend has a 1% chance of being slower than its p99, independently:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Backends called\u003c/th>\u003cth>Chance at least one is slower than p99\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>1%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>4.9%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>20\u003c/td>\u003ctd>18.2%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>100\u003c/td>\u003ctd>63.4%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The formula is 1 - 0.99^n.\u003c/p>\u003cp>The symptom is a product that is intermittently slow while every service's median looks healthy. The problem is hard to reproduce, because any single test request will probably be fast.\u003c/p>\u003cp>Common causes include garbage collection pauses, lock contention, \u003ca href=\"#Queueing%20delay\" data-term=\"Queueing delay\">queueing delay\u003c/a>, cache misses, retries, background work such as database compaction, and other workloads competing on shared hardware. A \u003ca href=\"#Distributed%20trace\" data-term=\"Distributed trace\">distributed trace\u003c/a> of a slow request shows where the time went, and \u003ca href=\"#Profiling\" data-term=\"Profiling\">profiling\u003c/a> can explain why.\u003c/p>\u003cp>Several techniques reduce the effect. Lower the fan-out, or return partial results when a deadline passes. Set timeouts based on observed latency. Use hedged requests, which send a second copy to another replica if the first has not replied after a short wait, and take whichever answers first. Hedging adds load, so limit how often it triggers.\u003c/p>\u003cp>Check the measurement too. Load tools affected by \u003ca href=\"#Coordinated%20omission\" data-term=\"Coordinated omission\">coordinated omission\u003c/a> can understate the tail by a wide margin.\u003c/p>","avoid":"","usage":["Each service is under 50 ms at p50. Why does the page take two seconds for some users?","It fans out to 40 services. That's a tail latency problem, since one slow call holds up the whole response."],"out":[21,52,23,56,53]},{"name":"Synthetic monitoring","section":2,"description":"Running scripted requests against a service on a schedule to check it works, whether or not real users are active.","body":"\u003cp>Synthetic \u003ca href=\"#Monitoring\" data-term=\"Monitoring\">monitoring\u003c/a> is running scripted checks against a service on a schedule, from outside it, to verify that it works. A check can be a single HTTP request or a browser script that signs in, adds an item to a basket and reaches checkout. Because it does not depend on user traffic, it can detect failures when nobody is using the service.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Check type\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Catches\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Uptime\u003c/td>\u003ctd>Requests a URL and checks the status\u003c/td>\u003ctd>Full outages, DNS faults, expired certificates\u003c/td>\u003c/tr>\u003ctr>\u003ctd>API\u003c/td>\u003ctd>Calls endpoints in sequence, validates replies\u003c/td>\u003ctd>Broken contracts and authentication\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Browser\u003c/td>\u003ctd>Drives a real browser through a user journey\u003c/td>\u003ctd>Broken pages and script errors\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Multi-region\u003c/td>\u003ctd>Runs the same check from several locations\u003c/td>\u003ctd>Regional routing failures\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The main use is covering quiet periods. A bad deployment at 3am breaks login, no customers are awake to notice, and the first report arrives at 8am. A scripted login every minute would have raised an \u003ca href=\"#Alert\" data-term=\"Alert\">alert\u003c/a> within minutes, which directly lowers \u003ca href=\"#MTTD\" data-term=\"MTTD\">MTTD\u003c/a>.\u003c/p>\u003cp>The limits come from the fact that the users are not real. Only the scripted paths are covered. A clean browser on a fast datacenter connection does not represent an old phone on a slow network, so pair it with \u003ca href=\"#Real%20user%20monitoring\" data-term=\"Real user monitoring\">real user monitoring\u003c/a>.\u003c/p>\u003cp>A few practices keep checks trustworthy. Require failures from more than one location before paging, so that a network problem at one probe does not wake anyone. Use dedicated test accounts and tag the traffic so it stays out of business analytics and any \u003ca href=\"#SLI\" data-term=\"SLI\">SLI\u003c/a> based on real users. Avoid real side effects such as live payments. Maintain the scripts, because a redesigned button will fail a browser check, and a check that fails routinely contributes to \u003ca href=\"#Alert%20fatigue\" data-term=\"Alert fatigue\">alert fatigue\u003c/a>.\u003c/p>","avoid":"","usage":["Nobody noticed the password reset was broken until Monday.","It gets almost no weekend traffic. Add a synthetic monitoring check for that flow so we don't rely on users reporting it."],"out":[13,35,9,34,3,36]},{"name":"Real user monitoring","section":2,"description":"Collecting performance and error data from actual users' browsers or apps as they use the product.","body":"\u003cp>Real user \u003ca href=\"#Monitoring\" data-term=\"Monitoring\">monitoring\u003c/a> (RUM) is collecting performance and error data from real users' browsers or apps during real sessions. A small script or SDK measures page loads, interactions and client-side errors, then sends the results to a backend.\u003c/p>\u003cp>It is usually paired with \u003ca href=\"#Synthetic%20monitoring\" data-term=\"Synthetic monitoring\">synthetic monitoring\u003c/a>, and the two have opposite strengths:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Aspect\u003c/th>\u003cth>Real user monitoring\u003c/th>\u003cth>Synthetic monitoring\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Traffic\u003c/td>\u003ctd>Real users\u003c/td>\u003ctd>Scripted checks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Coverage\u003c/td>\u003ctd>The devices and networks users have\u003c/td>\u003ctd>Chosen paths and locations\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Works with no traffic\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Stable over time\u003c/td>\u003ctd>Noisy, as the user mix changes\u003c/td>\u003ctd>Stable baseline\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Good at finding\u003c/td>\u003ctd>Problems affecting one segment\u003c/td>\u003ctd>Outages on known paths\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>RUM shows what server-side \u003ca href=\"#Metric\" data-term=\"Metric\">metrics\u003c/a> cannot. A server can report an 80 ms response while the user waits six seconds, because the time went to the network, a large script bundle or page rendering. The familiar symptom is a backend dashboard that looks fine while users in one country on mobile complain. Segmenting by device, browser, country, connection type and release version usually exposes the group affected. Use \u003ca href=\"#Percentile\" data-term=\"Percentile\">percentiles\u003c/a>, because client timings have a long tail.\u003c/p>\u003cp>RUM has a blind spot during severe failures. If a page fails to load at all, its script may never run, so the outage appears as a drop in sessions and not as a rise in errors. Ad blockers and privacy settings also block some reporting. Watch session volume alongside error rate.\u003c/p>\u003cp>Because RUM runs on users' devices, privacy needs attention. URLs and form fields can contain personal data, and session recording can capture more. Collect the minimum, mask sensitive fields and follow consent rules. The script itself adds page weight, so keep it small.\u003c/p>","avoid":"","usage":["Our API p95 is 90 ms, so I don't buy that the app feels slow.","Real user monitoring says p75 load on Android in Brazil is nine seconds. The API isn't where that time is going."],"out":[13,33,17,21]},{"name":"Alert","section":3,"description":"An automated notification that a monitored condition has been met and may need someone's attention.","body":"\u003cp>An alert is an automated notification that a monitored condition has been met. It is defined by a rule such as &quot;error rate above 2% for 5 minutes&quot;, a severity, a destination and ideally a link to a \u003ca href=\"#Runbook\" data-term=\"Runbook\">runbook\u003c/a>. The duration in the rule filters out brief blips, at the price of a slower response.\u003c/p>\u003cp>Alerts should be routed according to how quickly someone needs to act:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Delivery\u003c/th>\u003cth>Expected response\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Page\u003c/td>\u003ctd>Phone call or push\u003c/td>\u003ctd>Act within minutes\u003c/td>\u003ctd>Checkout is failing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ticket\u003c/td>\u003ctd>Issue queue\u003c/td>\u003ctd>Act within days\u003c/td>\u003ctd>Disk fills in two weeks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Record\u003c/td>\u003ctd>Dashboard, no notification\u003c/td>\u003ctd>Read during investigation\u003c/td>\u003ctd>Brief spike in retries\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The test for a page is whether a person needs to do something now. A page that wakes an engineer for a condition that clears itself before they have opened a laptop teaches them to ignore the next one, which leads to \u003ca href=\"#Alert%20fatigue\" data-term=\"Alert fatigue\">alert fatigue\u003c/a>. If no action is needed, make it a ticket or remove it.\u003c/p>\u003cp>Flapping is a common defect, where a value hovers around the threshold and the alert fires and clears repeatedly. Use a longer window, or separate thresholds for firing and clearing.\u003c/p>\u003cp>A useful page says what is broken and who is affected. &quot;HighCPU on host-17&quot; leaves the responder to work out whether anything matters. &quot;Checkout error rate 4%, EU users affected&quot; with links to a dashboard and runbook gives a starting point.\u003c/p>\u003cp>Grouping related alerts stops one outage from sending 200 notifications. Silences for planned maintenance should have an expiry.\u003c/p>\u003cp>Pages are generally tied to user impact through \u003ca href=\"#Symptom-based%20alerting\" data-term=\"Symptom-based alerting\">symptom-based alerting\u003c/a>, often as a \u003ca href=\"#Burn%20rate%20alert\" data-term=\"Burn rate alert\">burn rate alert\u003c/a> on an \u003ca href=\"#SLO\" data-term=\"SLO\">SLO\u003c/a>. They go to whoever is \u003ca href=\"#On-call\" data-term=\"On-call\">on-call\u003c/a>.\u003c/p>","avoid":"","usage":["I got paged for high memory at 4am and it was gone by the time I logged in.","Then that alert shouldn't page. Downgrade it to a ticket and page on user-facing errors instead."],"out":[40,36,37,38,4,39]},{"name":"Alert fatigue","section":3,"description":"When frequent or low-value alerts train responders to ignore them, so real problems get missed or handled late.","body":"\u003cp>\u003ca href=\"#Alert\" data-term=\"Alert\">Alert\u003c/a> fatigue is the loss of attention that happens when responders receive so many low-value alerts that they stop treating each one as meaningful. In practice, the phone goes off, the \u003ca href=\"#On-call\" data-term=\"On-call\">on-call\u003c/a> engineer acknowledges it without reading because it is usually nothing, and the one page that mattered looks the same as the forty that did not.\u003c/p>\u003cp>Each cause has a specific fix:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Cause\u003c/th>\u003cth>Example\u003c/th>\u003cth>Fix\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Not actionable\u003c/td>\u003ctd>CPU high with no user impact\u003c/td>\u003ctd>Remove it or make it a ticket\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Threshold too tight\u003c/td>\u003ctd>Fires at every daily traffic peak\u003c/td>\u003ctd>Tune from history, or use a \u003ca href=\"#Burn%20rate%20alert\" data-term=\"Burn rate alert\">burn rate alert\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Flapping\u003c/td>\u003ctd>Fires and clears every few minutes\u003c/td>\u003ctd>Longer window, separate clear threshold\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Duplicates\u003c/td>\u003ctd>One outage sends 200 pages\u003c/td>\u003ctd>Group and deduplicate\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Stale\u003c/td>\u003ctd>Nobody knows why it exists\u003c/td>\u003ctd>Review and delete\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Expected\u003c/td>\u003ctd>Deployment restarts trigger a page\u003c/td>\u003ctd>Silence during known changes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Review alerts as a routine. At the end of each on-call shift, go through every page and ask three questions: was it real, did it need a human, and was the action clear? Track the share of pages that needed action. If a hypothetical shift had 40 pages and 6 needed action, precision was 15%, and the other 34 pages are the list to work through.\u003c/p>\u003cp>Repeated interruptions also disrupt sleep and can drive experienced engineers to leave the team.\u003c/p>\u003cp>Teams often hesitate to delete alerts in case one turns out to matter. Moving to \u003ca href=\"#Symptom-based%20alerting\" data-term=\"Symptom-based alerting\">symptom-based alerting\u003c/a> reduces that risk, because user impact is covered whatever the cause. If you are unsure about a specific alert, demote it to a ticket for a month and see whether anyone misses it.\u003c/p>","avoid":"","usage":["I muted the channel, it's just the same five alerts all day.","That's alert fatigue, and it's how we missed the payment page last week. Let's review every alert from this rota on Friday."],"out":[35,39,38,37]},{"name":"Symptom-based alerting","section":3,"description":"Paging on what users experience, such as errors and slowness, instead of on internal causes such as high CPU.","body":"\u003cp>Symptom-based alerting is paging on what users experience, such as failed or slow requests, instead of on internal conditions that may or may not matter. A symptom is what is wrong from the user's side. A cause is why it is happening.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Aspect\u003c/th>\u003cth>Cause-based \u003ca href=\"#Alert\" data-term=\"Alert\">alert\u003c/a>\u003c/th>\u003cth>Symptom-based alert\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Example\u003c/td>\u003ctd>CPU above 90%\u003c/td>\u003ctd>Checkout errors threatening the \u003ca href=\"#SLO\" data-term=\"SLO\">SLO\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fires with no user harm\u003c/td>\u003ctd>Often\u003c/td>\u003ctd>Rarely\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Catches unforeseen failures\u003c/td>\u003ctd>Only the listed causes\u003c/td>\u003ctd>Any cause with visible impact\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Explains why\u003c/td>\u003ctd>Sometimes\u003c/td>\u003ctd>No, this needs investigation\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Cause-based alerts fail in two directions. One replica dies behind a load balancer, traffic moves to the others, no user notices, and someone is still woken at 3am. On another night a bad configuration fails every payment while CPU, memory and disk stay normal, and nothing pages. Teams recognise this as being woken for harmless events and missing the serious ones.\u003c/p>\u003cp>To implement it, measure an \u003ca href=\"#SLI\" data-term=\"SLI\">SLI\u003c/a> close to the user and alert on it, commonly with a \u003ca href=\"#Burn%20rate%20alert\" data-term=\"Burn rate alert\">burn rate alert\u003c/a>. Keep cause data on dashboards, such as the \u003ca href=\"#Golden%20signals\" data-term=\"Golden signals\">golden signals\u003c/a>, where it helps with diagnosis once a page has fired.\u003c/p>\u003cp>Some causes still warrant an alert, because by the time the symptom appears it is too late to act cheaply. A disk filling up, a certificate about to expire, a quota nearly reached and a failing backup job all belong here. These alerts give lead time, and many can be tickets.\u003c/p>\u003cp>Low-traffic services need extra care, because one failure in ten requests reads as a 10% error rate. Add a minimum request count to the rule, or use \u003ca href=\"#Synthetic%20monitoring\" data-term=\"Synthetic monitoring\">synthetic monitoring\u003c/a> to provide steady traffic. For data pipelines, the symptom is usually stale data, so alert on freshness.\u003c/p>","avoid":"","usage":["Should we page when a Kafka broker goes down?","Not by itself. With symptom-based alerting we page if producers start failing, and a lost broker opens a ticket for the morning."],"out":[35,4,3,38,28,33]},{"name":"Burn rate alert","section":3,"description":"An alert on how fast an error budget is being spent, so severe failures page quickly and slow ones raise a ticket.","body":"\u003cp>A burn rate \u003ca href=\"#Alert\" data-term=\"Alert\">alert\u003c/a> fires based on how fast a service is consuming its \u003ca href=\"#Error%20budget\" data-term=\"Error budget\">error budget\u003c/a>. Burn rate is the observed error rate divided by the error rate the \u003ca href=\"#SLO\" data-term=\"SLO\">SLO\u003c/a> allows. A burn rate of 1 spends the budget exactly over the SLO window, and a burn rate of 10 spends it in a tenth of the window.\u003c/p>\u003cp>For a 99.9% SLO over 30 days, the allowed error rate is 0.1%. An observed error rate of 1.44% is a burn rate of 14.4, and at that pace the 720-hour budget lasts 50 hours.\u003c/p>\u003cp>Plain thresholds handle this badly. A rule such as &quot;errors above 0.1% for 5 minutes&quot; pages on small blips that cost almost no budget, while a steady leak just under the threshold never fires.\u003c/p>\u003cp>The Google SRE Workbook recommends pairing a long and a short window at several burn rates:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Severity\u003c/th>\u003cth>Long window\u003c/th>\u003cth>Short window\u003c/th>\u003cth>Burn rate\u003c/th>\u003cth>Budget spent\u003c/th>\u003cth>Error rate at 99.9%\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Page\u003c/td>\u003ctd>1 hour\u003c/td>\u003ctd>5 minutes\u003c/td>\u003ctd>14.4\u003c/td>\u003ctd>2%\u003c/td>\u003ctd>1.44%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Page\u003c/td>\u003ctd>6 hours\u003c/td>\u003ctd>30 minutes\u003c/td>\u003ctd>6\u003c/td>\u003ctd>5%\u003c/td>\u003ctd>0.6%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ticket\u003c/td>\u003ctd>3 days\u003c/td>\u003ctd>6 hours\u003c/td>\u003ctd>1\u003c/td>\u003ctd>10%\u003c/td>\u003ctd>0.1%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Budget spent is burn rate x long window / 720 hours, so the first row is 14.4 x 1 / 720 = 2%.\u003c/p>\u003cp>Both windows must exceed the threshold. The long window shows that a meaningful amount of budget has gone. The short window, one twelfth of the long one, confirms the problem is still happening, so the alert clears soon after a fix.\u003c/p>\u003cp>Low-traffic services need adjustment, since one failure in 50 requests is a 2% error rate. Add a minimum request count or synthetic traffic.\u003c/p>","avoid":"","usage":["Error rate is only 0.7%. Is that worth waking anyone?","On a 99.9% SLO that's a burn rate of 7, so the budget is gone in about four days. If it holds, the six-hour burn rate alert will page."],"out":[35,6,4]},{"name":"On-call","section":3,"description":"A rota in which an engineer is responsible for responding to production alerts within an agreed time.","body":"\u003cp>On-call is an arrangement in which an engineer is responsible, for a set period, for responding to production \u003ca href=\"#Alert\" data-term=\"Alert\">alerts\u003c/a> within an agreed time. Teams share the duty through a rota, commonly changing weekly or daily.\u003c/p>\u003cp>A typical setup has several layers:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Role\u003c/th>\u003cth>Responsibility\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Primary\u003c/td>\u003ctd>Receives the page, acknowledges it and starts the response\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Secondary\u003c/td>\u003ctd>Takes the page if the primary does not acknowledge in time\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Escalation contact\u003c/td>\u003ctd>A manager or subject expert for decisions and extra help\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Acknowledging a page means &quot;I have this&quot;. If nobody acknowledges within a set time, often 5 to 15 minutes, the paging tool escalates to the next layer. Required response times usually depend on the \u003ca href=\"#Severity%20level\" data-term=\"Severity level\">severity level\u003c/a>.\u003c/p>\u003cp>Rota size determines how sustainable the duty is. With six people on a weekly rota, each engineer is on-call one week in six. Teams spread across time zones can use a follow-the-sun rota, where each region covers its own daytime so nobody is paged overnight.\u003c/p>\u003cp>An unhealthy rota is easy to recognise. People dread their week, sleep badly, and one person gets called regardless of who is on duty because only they understand a particular system. The usual causes are noisy alerts that produce \u003ca href=\"#Alert%20fatigue\" data-term=\"Alert fatigue\">alert fatigue\u003c/a>, knowledge held by one person, and a missing \u003ca href=\"#Runbook\" data-term=\"Runbook\">runbook\u003c/a>. Track pages per shift, night-time pages and hours spent, and treat a bad trend as a production problem.\u003c/p>\u003cp>Some practices help. Write handoff notes at the end of each shift covering open issues. Let new engineers shadow a shift before taking one alone. Compensate on-call with pay or time off, including recovery time after a bad night. Quiet shifts can go toward reducing \u003ca href=\"#Toil\" data-term=\"Toil\">toil\u003c/a>.\u003c/p>","avoid":"","usage":["Priya got paged about the billing job again and she's not even on-call this week.","Because she's the only one who knows it. Let's write the runbook and have someone else shadow her next time."],"out":[35,42,36,40,8]},{"name":"Runbook","section":3,"description":"A written procedure for diagnosing and handling a specific alert or operational task.","body":"\u003cp>A runbook is a written procedure for diagnosing and handling a specific \u003ca href=\"#Alert\" data-term=\"Alert\">alert\u003c/a> or operational task. Its reader is an \u003ca href=\"#On-call\" data-term=\"On-call\">on-call\u003c/a> engineer who may not know the service and may have just been woken up.\u003c/p>\u003cp>A typical runbook follows this order:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Section\u003c/th>\u003cth>Contents\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>What this means\u003c/td>\u003ctd>The alert in plain language, and the likely user impact\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Check\u003c/td>\u003ctd>Dashboards, queries and commands that confirm the problem\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mitigate\u003c/td>\u003ctd>Ordered, safe actions with exact commands\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Verify\u003c/td>\u003ctd>What recovery looks like\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Escalate\u003c/td>\u003ctd>Who to contact and when\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Context\u003c/td>\u003ctd>Links to architecture notes and past \u003ca href=\"#Incident\" data-term=\"Incident\">incidents\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The problem a runbook solves shows up at 3am. A page says &quot;queue depth high&quot; with no link. The wiki page someone finds is two years old and refers to a host that no longer exists, so the responder ends up phoning a colleague who is asleep. Linking the runbook directly from the alert removes the search.\u003c/p>\u003cp>Write for someone under pressure. Give exact commands with placeholders, the expected output of each step, and warnings on anything dangerous. Put \u003ca href=\"#Mitigation\" data-term=\"Mitigation\">mitigation\u003c/a> ahead of root-cause analysis, because the first goal is to restore service.\u003c/p>\u003cp>A stale runbook can do harm, since a responder will follow its instructions against a system that has since changed. Keep runbooks near the code, review them when the service changes, and update them after each use. A \u003ca href=\"#Game%20day\" data-term=\"Game day\">game day\u003c/a> is a good way to find out whether one still works.\u003c/p>\u003cp>If a runbook is a fixed sequence that needs no judgement, it is \u003ca href=\"#Toil\" data-term=\"Toil\">toil\u003c/a> and a candidate for automation, either as a script a person triggers or as a fix that removes the page altogether.\u003c/p>","avoid":"","usage":["The alert fired but I have no idea what this consumer even does.","Follow the runbook link in the page. Step two tells you how to drain the queue safely, and it lists who to call if that fails."],"out":[35,39,41,44,59,8]},{"name":"Incident","section":4,"description":"An unplanned disruption or degradation of a service that needs a coordinated response to restore normal operation.","body":"\u003cp>An incident is an unplanned disruption or degradation of a service that requires a coordinated response. A server crash absorbed by redundancy is a normal event. The same crash causing failed user requests is an incident. Many teams also declare incidents for security events and serious near misses.\u003c/p>\u003cp>An incident generally moves through these stages:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Detect\u003c/td>\u003ctd>\u003ca href=\"#Alert\" data-term=\"Alert\">Alert\u003c/a> or customer\u003c/td>\u003ctd>The problem is noticed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Triage\u003c/td>\u003ctd>\u003ca href=\"#On-call\" data-term=\"On-call\">On-call\u003c/a> engineer\u003c/td>\u003ctd>Assesses impact and sets a \u003ca href=\"#Severity%20level\" data-term=\"Severity level\">severity level\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Declare\u003c/td>\u003ctd>On-call engineer\u003c/td>\u003ctd>Opens a channel and names an \u003ca href=\"#Incident%20commander\" data-term=\"Incident commander\">incident commander\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mitigate\u003c/td>\u003ctd>Responders\u003c/td>\u003ctd>Applies a \u003ca href=\"#Mitigation\" data-term=\"Mitigation\">mitigation\u003c/a> to restore service\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Resolve\u003c/td>\u003ctd>Responders\u003c/td>\u003ctd>Confirms recovery and closes the incident\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Learn\u003c/td>\u003ctd>Team\u003c/td>\u003ctd>Writes a \u003ca href=\"#Blameless%20postmortem\" data-term=\"Blameless postmortem\">blameless postmortem\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The cost of having no process is easy to recognise. Five engineers debug separately in direct messages, two of them push different changes at the same moment, support has no idea what to tell customers, and nobody knows who is in charge. Declaring an incident creates one place to talk and clear roles.\u003c/p>\u003cp>Declare early. A false alarm costs a few minutes to close, while a late declaration leaves people working without coordination during the period that matters. Written criteria remove the need for judgement under stress, for example any customer-visible impact lasting over 10 minutes, any risk to data, or any problem needing more than one team.\u003c/p>\u003cp>During the response, keep a timestamped record of observations and actions, since memory of the sequence fades quickly and the review depends on it. Send stakeholders updates at a regular interval, even when the update is that nothing has changed.\u003c/p>\u003cp>Each incident spends \u003ca href=\"#Error%20budget\" data-term=\"Error budget\">error budget\u003c/a>, and its timings feed measures such as \u003ca href=\"#MTTD\" data-term=\"MTTD\">MTTD\u003c/a> and \u003ca href=\"#MTTR\" data-term=\"MTTR\">MTTR\u003c/a>.\u003c/p>","avoid":"","usage":["Should I open an incident? It might just be a blip on the payments graph.","Open it. If it's nothing, we close it in five minutes, and if it's real we already have a channel and a commander."],"out":[35,39,42,43,44,45,6,9,10]},{"name":"Severity level","section":4,"description":"A ranking of an incident's impact that sets how urgently people respond and who gets involved.","body":"\u003cp>A severity level is a ranking of an \u003ca href=\"#Incident\" data-term=\"Incident\">incident\u003c/a>'s impact that determines how urgently people respond and who gets involved. Most organisations use labels such as SEV1 to SEV4 or P0 to P3, with lower numbers meaning more serious. Exact definitions vary between companies.\u003c/p>\u003cp>Here is an example scale:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Impact\u003c/th>\u003cth>Response\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>SEV1\u003c/td>\u003ctd>Critical service down, or data at risk\u003c/td>\u003ctd>Page now, \u003ca href=\"#Incident%20commander\" data-term=\"Incident commander\">incident commander\u003c/a>, executive updates\u003c/td>\u003ctd>Checkout down for all users\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SEV2\u003c/td>\u003ctd>Major degradation, or key feature down for some\u003c/td>\u003ctd>Page now, incident commander\u003c/td>\u003ctd>Search failing in one region\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SEV3\u003c/td>\u003ctd>Minor or partial impact with a workaround\u003c/td>\u003ctd>Handle in working hours\u003c/td>\u003ctd>Report exports running slow\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SEV4\u003c/td>\u003ctd>Cosmetic or no user impact\u003c/td>\u003ctd>Ticket\u003c/td>\u003ctd>Broken chart on an admin page\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Define levels by user impact, and not by the technical cause or by who is complaining. Measurable criteria help: share of users affected, revenue at risk, data loss, security exposure. Without them, the familiar result is an argument in the incident channel about whether this is a SEV1 or a SEV2 while nobody works on the fix. Scales also decay in two directions. If everything is labelled SEV1, the label stops producing urgency. If teams label things low to avoid scrutiny, serious problems miss review.\u003c/p>\u003cp>When unsure, choose the higher level and downgrade later. Severity is expected to change as responders learn more, and each change should be recorded in the timeline.\u003c/p>\u003cp>Severity should drive process automatically. For example, SEV1 and SEV2 might require a \u003ca href=\"#Blameless%20postmortem\" data-term=\"Blameless postmortem\">blameless postmortem\u003c/a>, a status page update and customer notification.\u003c/p>\u003cp>Avoid using severity counts as a performance target for teams. Judging a team on its number of SEV1s encourages under-reporting, and hidden incidents cannot be learned from.\u003c/p>","avoid":"","usage":["Is this a SEV1? Only the EU region is affected.","EU is 40% of our customers and they can't pay. By our criteria that's a SEV1, and we can downgrade if the impact narrows."],"out":[41,43,45]},{"name":"Incident commander","section":4,"description":"The person who coordinates an incident response, assigning roles and making decisions instead of debugging.","body":"\u003cp>An \u003ca href=\"#Incident\" data-term=\"Incident\">incident\u003c/a> commander (IC) is the person who coordinates the response: assigning work, tracking progress, making decisions and keeping communication flowing. The IC does not debug. The role is adapted from the Incident Command System, which US emergency services developed in the 1970s to coordinate wildfire response.\u003c/p>\u003cp>The role exists because of what happens without it. The most senior engineer starts debugging and becomes absorbed. Nobody updates support, and two people apply conflicting fixes. Someone reading a stack trace cannot also track five workstreams.\u003c/p>\u003cp>Larger incidents split the work into roles:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Role\u003c/th>\u003cth>Responsibility\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Incident commander\u003c/td>\u003ctd>Owns the overall response and decisions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Operations lead\u003c/td>\u003ctd>Directs technical investigation and changes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Communications lead\u003c/td>\u003ctd>Updates stakeholders and customers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scribe\u003c/td>\u003ctd>Records the timeline, findings and decisions\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>In a small incident, one person may hold several of these roles. If the IC needs to go deep on a technical problem, they should hand over command first.\u003c/p>\u003cp>The IC runs a repeating loop: what do we know, what are we trying, who owns it, and when do we check back? Each action gets a named owner and a time, as in &quot;Sam, roll back payments and report in five minutes&quot;. The IC keeps the group focused on \u003ca href=\"#Mitigation\" data-term=\"Mitigation\">mitigation\u003c/a> over root-cause analysis while users are affected.\u003c/p>\u003cp>The IC does not need to be the most senior person or the deepest expert on the system. The job calls for coordination skills, and authority during the incident comes from the role.\u003c/p>\u003cp>Handovers should be explicit and announced in the channel. In long incidents, rotate the IC every few hours to avoid exhausted decisions. Teams can build this skill by shadowing and during a \u003ca href=\"#Game%20day\" data-term=\"Game day\">game day\u003c/a>.\u003c/p>","avoid":"","usage":["Everyone's in the call and three people are suggesting different fixes.","We need an incident commander. I'll take it. Dana, you own the rollback, and everyone else hold changes until she reports back."],"out":[41,44,59]},{"name":"Mitigation","section":4,"description":"An action that reduces or stops user impact during an incident, even if the underlying fault is not yet fixed.","body":"\u003cp>Mitigation is an action that reduces or stops user impact during an \u003ca href=\"#Incident\" data-term=\"Incident\">incident\u003c/a>, even while the underlying fault is still present. A rollback that restores service without explaining the bug is a mitigation. The permanent fix comes afterwards.\u003c/p>\u003cp>Responders usually choose from a familiar set of options:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mitigation\u003c/th>\u003cth>Use when\u003c/th>\u003cth>Watch for\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Roll back\u003c/td>\u003ctd>A recent release lines up with onset\u003c/td>\u003ctd>Schema or data changes may not reverse\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disable a feature flag, a switch that turns code off without a deploy\u003c/td>\u003ctd>A new feature is at fault\u003c/td>\u003ctd>Other code may depend on it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Drain or fail over\u003c/td>\u003ctd>One host, zone or region is bad\u003c/td>\u003ctd>The rest must absorb the traffic\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Shed load\u003c/td>\u003ctd>Demand exceeds capacity\u003c/td>\u003ctd>Some users get errors by design\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Restart\u003c/td>\u003ctd>A process is stuck or leaking\u003c/td>\u003ctd>Destroys evidence, and the fault may recur\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The common failure is spending 90 minutes establishing the root cause while users stay down, when a rollback was available in the first ten. Stop the impact first and explain it later. If an incident began right after a change, reversing that change is usually the first thing to try.\u003c/p>\u003cp>Capture evidence where it is cheap. A heap dump, thread dump or saved \u003ca href=\"#Log\" data-term=\"Log\">log\u003c/a> excerpt taken before a restart may be the only record of the faulty state. Do not hold up recovery to collect it.\u003c/p>\u003cp>Apply one change at a time where possible, so you can tell what worked, and confirm the effect using a user-level \u003ca href=\"#SLI\" data-term=\"SLI\">SLI\u003c/a> instead of assuming.\u003c/p>\u003cp>A mitigation also needs a follow-up. Temporary measures such as extra replicas or a disabled job tend to become permanent unless someone tracks them. The time taken to reach this point is what the &quot;restore&quot; version of \u003ca href=\"#MTTR\" data-term=\"MTTR\">MTTR\u003c/a> measures.\u003c/p>","avoid":"","usage":["I think I've nearly found the bug, give me another twenty minutes.","Users are still down. Roll back as the mitigation now, then keep digging with the pressure off."],"out":[41,15,3,10]},{"name":"Blameless postmortem","section":4,"description":"A written review of an incident that examines how the system allowed it, without assigning fault to individuals.","body":"\u003cp>A blameless postmortem is a written review of an \u003ca href=\"#Incident\" data-term=\"Incident\">incident\u003c/a> that examines how the system and organisation allowed it to happen, without assigning fault to individuals. It starts from the assumption that people acted reasonably given what they knew at the time.\u003c/p>\u003cp>The reason is practical. If admitting a mistake leads to punishment, people stop reporting mistakes and leave details out, and the organisation loses the information it needs. The recognisable failure is a report concluding &quot;engineer ran the wrong command, reminded to be more careful&quot;. Nothing changes, and the same failure returns. Better questions are why one command could do that much damage, why nothing asked for confirmation, and why staging behaved differently.\u003c/p>\u003cp>A typical document contains:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Section\u003c/th>\u003cth>Contents\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Summary\u003c/td>\u003ctd>What happened, in a few sentences\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Impact\u003c/td>\u003ctd>Users affected, duration, \u003ca href=\"#Error%20budget\" data-term=\"Error budget\">error budget\u003c/a> spent\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Timeline\u003c/td>\u003ctd>Timestamped events and decisions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Contributing%20factor\" data-term=\"Contributing factor\">Contributing factors\u003c/a>\u003c/td>\u003ctd>Conditions that allowed or worsened the failure\u003c/td>\u003c/tr>\u003ctr>\u003ctd>What went well\u003c/td>\u003ctd>Practices worth keeping\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Action items\u003c/td>\u003ctd>Specific changes, each with an owner and due date\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Blameless does not mean unaccountable. People are still expected to take part honestly and to complete their actions. Many teams refer to roles in the document, such as &quot;the \u003ca href=\"#On-call\" data-term=\"On-call\">on-call\u003c/a> engineer&quot;, instead of names.\u003c/p>\u003cp>Action items are where postmortems most often fail. Vague, unowned items such as &quot;improve \u003ca href=\"#Monitoring\" data-term=\"Monitoring\">monitoring\u003c/a>&quot; are forgotten once the document is filed. Write specific, checkable items, such as &quot;page when payment errors burn budget at 14.4 times the allowed rate&quot;. Prefer changes to systems over training or reminders, because systems do not depend on someone remembering. Track items to completion with the same priority as feature work.\u003c/p>\u003cp>Hold the review within a few days and share the result widely.\u003c/p>","avoid":"","usage":["The postmortem draft says Tom caused the outage by deploying on Friday.","Rewrite that. Ask why our pipeline let a broken config reach every region, because that's still true whoever deploys next."],"out":[41,6,46,39,13]},{"name":"Contributing factor","section":4,"description":"A condition that helped an incident happen or made it worse, used in place of naming one single root cause.","body":"\u003cp>A contributing factor is a condition that helped an \u003ca href=\"#Incident\" data-term=\"Incident\">incident\u003c/a> happen or made it worse. Incident reviews use the term because failures in complex systems rarely have one cause. Several ordinary conditions, each harmless alone, combine.\u003c/p>\u003cp>Consider a hypothetical incident in which a configuration change sets a timeout to zero and takes an API down for 50 minutes:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Contributing factor\u003c/th>\u003cth>Effect\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Config values were not validated\u003c/td>\u003ctd>The bad value was accepted\u003c/td>\u003ctd>Add schema validation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Change applied to all regions at once\u003c/td>\u003ctd>Local mistake became global\u003c/td>\u003ctd>Roll out region by region\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Alert\" data-term=\"Alert\">Alerts\u003c/a> watched only CPU\u003c/td>\u003ctd>Detected after 20 minutes, by support\u003c/td>\u003ctd>Add \u003ca href=\"#Symptom-based%20alerting\" data-term=\"Symptom-based alerting\">symptom-based alerting\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Runbook\" data-term=\"Runbook\">Runbook\u003c/a> had an old command\u003c/td>\u003ctd>Recovery took 15 minutes longer\u003c/td>\u003ctd>Update and test it\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A trigger is different from a factor. The trigger is the event that set off the failure, here the config change. The factors explain why that event did so much damage, and most of them existed long before the day of the incident.\u003c/p>\u003cp>Asking for a single root cause tends to stop the investigation at the first plausible answer, which is often the last human action: &quot;an engineer pushed bad config&quot;. Fixing only that leaves every other condition in place, ready to combine with the next mistake. The symptom is a team that closes each incident with a fix and still sees the same kind of failure return with a different trigger.\u003c/p>\u003cp>&quot;Human error&quot; is not a useful factor on its own. Treat it as the start of the question: what made this action easy to get wrong and hard to notice?\u003c/p>\u003cp>Not every factor deserves work. In a \u003ca href=\"#Blameless%20postmortem\" data-term=\"Blameless postmortem\">blameless postmortem\u003c/a>, record a decision for each one: fix it, monitor it or accept the risk explicitly.\u003c/p>","avoid":"","usage":["Can we just put 'bad deploy' as the root cause and close this?","The deploy was the trigger. No canary and a silent alert were contributing factors, and those will bite us again."],"out":[41,35,37,40,45]},{"name":"Capacity planning","section":5,"description":"Forecasting future demand and arranging enough resources to serve it while still meeting reliability targets.","body":"\u003cp>Capacity planning is forecasting future demand and arranging enough resources to serve it while still meeting \u003ca href=\"#SLO\" data-term=\"SLO\">SLOs\u003c/a>. It covers compute, storage, network, database connections and third-party quotas.\u003c/p>\u003cp>The process follows a repeating sequence, shown here with hypothetical numbers:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Action\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Measure current peak\u003c/td>\u003ctd>6,000 requests per second\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Forecast growth\u003c/td>\u003ctd>10% a month for 6 months gives about 10,630\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Measure unit capacity\u003c/td>\u003ctd>\u003ca href=\"#Load%20testing\" data-term=\"Load testing\">Load testing\u003c/a> shows 500 per instance within SLO\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Calculate need\u003c/td>\u003ctd>10,630 / 500 = 21.26, so 22 instances\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Add redundancy\u003c/td>\u003ctd>To survive losing one of 3 zones, 11 per zone, 33 total\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Review\u003c/td>\u003ctd>Compare forecast with actual each quarter\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Step 5 is often skipped. With 22 instances spread over three zones, losing a zone leaves 14 or 15, which cannot carry the forecast peak. With 33, the remaining two zones hold 22.\u003c/p>\u003cp>Forecasts need two inputs. Organic growth is the steady trend visible in historical data. Inorganic growth comes from launches, marketing campaigns and large new customers, and it appears in no graph until it happens. The familiar failure is a launch that takes the site down because nobody told the infrastructure team about it.\u003c/p>\u003cp>Lead times shape the plan. Quota increases, hardware orders and splitting a database can take weeks. Autoscaling, which adds instances automatically as load rises, does not remove the need to plan. It reacts with a delay, stops at quota limits and does not help components that cannot scale out, such as a single primary database.\u003c/p>\u003cp>Plan around \u003ca href=\"#Saturation\" data-term=\"Saturation\">saturation\u003c/a> instead of CPU alone, and keep headroom, because \u003ca href=\"#Queueing%20delay\" data-term=\"Queueing delay\">queueing delay\u003c/a> rises sharply near capacity. Re-measure unit capacity after major releases, since a performance regression changes every number above.\u003c/p>","avoid":"","usage":["Marketing is running a TV ad in March. Do we need to do anything?","Yes, get the expected traffic from them now. Capacity planning needs a number, and our database quota takes weeks to raise."],"out":[4,48,31,52]},{"name":"Load testing","section":5,"description":"Sending realistic traffic to a system at expected volumes to check that it meets its performance targets.","body":"\u003cp>Load testing is sending realistic traffic to a system at expected volumes to check whether it meets its performance targets. A typical question is whether the service can handle next month's peak with p99 latency under 300 ms.\u003c/p>\u003cp>It belongs to a family of tests that ask different questions:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Test\u003c/th>\u003cth>Question\u003c/th>\u003cth>Load shape\u003c/th>\u003cth>Typical duration\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Load test\u003c/td>\u003ctd>Does it meet targets at expected load?\u003c/td>\u003ctd>Ramp to peak and hold\u003c/td>\u003ctd>Minutes to an hour\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Stress%20testing\" data-term=\"Stress testing\">Stress test\u003c/a>\u003c/td>\u003ctd>Where and how does it break?\u003c/td>\u003ctd>Increase past capacity\u003c/td>\u003ctd>Until failure\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Soak%20test\" data-term=\"Soak test\">Soak test\u003c/a>\u003c/td>\u003ctd>Does it degrade over time?\u003c/td>\u003ctd>Steady and moderate\u003c/td>\u003ctd>Hours to days\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The result is only as good as the realism of the test. The common symptom is a system that passes at 5,000 requests per second and falls over in production at 2,000. Usual reasons are simulated users all requesting the same cached URL, a test database far smaller than production, missing background jobs, and an environment that differs from production.\u003c/p>\u003cp>Derive the traffic mix from production \u003ca href=\"#Log\" data-term=\"Log\">logs\u003c/a>. Use data volumes close to production. Ramp up gradually and hold long enough to get past cold caches. Report \u003ca href=\"#Percentile\" data-term=\"Percentile\">percentiles\u003c/a> and error rates, not averages.\u003c/p>\u003cp>Watch the load generator too. If it runs out of CPU, the latencies it reports are wrong. Prefer an open workload, which sends requests at a fixed arrival rate whatever the responses do. Tools that wait for each reply slow down along with the server and hide the delay, an error called \u003ca href=\"#Coordinated%20omission\" data-term=\"Coordinated omission\">coordinated omission\u003c/a>.\u003c/p>\u003cp>\u003ca href=\"#Little's%20Law\" data-term=\"Little's Law\">Little's Law\u003c/a> gives a quick sanity check: 50 clients that each wait for a reply at 200 ms average latency cannot exceed 250 requests per second.\u003c/p>\u003cp>Results feed directly into \u003ca href=\"#Capacity%20planning\" data-term=\"Capacity planning\">capacity planning\u003c/a>.\u003c/p>","avoid":"","usage":["The load test passed at twice our peak, so Black Friday is safe.","It also hit one product page with an empty cart table. Replay real traffic against a production-sized database before we trust that."],"out":[49,50,15,21,53,51,47]},{"name":"Stress testing","section":5,"description":"Pushing a system past its expected capacity to find where it breaks, how it fails and whether it recovers.","body":"\u003cp>Stress testing is pushing a system beyond its expected capacity to find where it breaks, how it fails and whether it recovers. \u003ca href=\"#Load%20testing\" data-term=\"Load testing\">Load testing\u003c/a> asks whether a system meets its targets at expected demand.\u003c/p>\u003cp>A stress test usually runs in phases:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Phase\u003c/th>\u003cth>Action\u003c/th>\u003cth>Record\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Baseline\u003c/td>\u003ctd>Run at normal load\u003c/td>\u003ctd>Latency and error rate\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ramp\u003c/td>\u003ctd>Raise load in steps, holding each\u003c/td>\u003ctd>The point where the \u003ca href=\"#SLO\" data-term=\"SLO\">SLO\u003c/a> fails\u003c/td>\u003c/tr>\u
