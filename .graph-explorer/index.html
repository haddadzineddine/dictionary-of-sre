003ctr>\u003ctd>Break\u003c/td>\u003ctd>Continue until errors dominate\u003c/td>\u003ctd>First resource to reach \u003ca href=\"#Saturation\" data-term=\"Saturation\">saturation\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Recover\u003c/td>\u003ctd>Drop back to normal load\u003c/td>\u003ctd>Time to recover, or failure to recover\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The first useful output is the knee: the load at which latency starts rising sharply because \u003ca href=\"#Queueing%20delay\" data-term=\"Queueing delay\">queueing delay\u003c/a> takes over. Plan capacity below the knee, not at the point of collapse.\u003c/p>\u003cp>How the system fails matters as much as where. In a graceful failure, it rejects excess requests quickly and keeps serving what it can. In a collapse, it accepts everything, queues grow, timeouts trigger retries, and it spends its time on requests whose clients have already given up. Throughput then falls as load rises.\u003c/p>\u003cp>The recovery phase catches a difficult case known as a metastable failure, where the system stays broken after the original trigger has gone. Retries or cold caches keep load above what it can handle. In production this appears as a traffic spike that has passed while the service stays down until someone restarts it or blocks traffic. A \u003ca href=\"#Thundering%20herd\" data-term=\"Thundering herd\">thundering herd\u003c/a> is a frequent cause.\u003c/p>\u003cp>Findings usually lead to load shedding (rejecting excess work on purpose), bounded queues, timeouts, and retry budgets that cap retries as a share of requests.\u003c/p>\u003cp>Run stress tests in an isolated environment, and confirm that each \u003ca href=\"#Alert\" data-term=\"Alert\">alert\u003c/a> fires at the expected point.\u003c/p>","avoid":"","usage":["We know it handles 8,000 requests a second. What happens at 12,000?","Nobody knows. Let's stress test it in staging, then drop the load and see if it recovers without a restart."],"out":[48,4,31,52,54,35]},{"name":"Soak test","section":5,"description":"Running a system at steady, realistic load for hours or days to expose problems that only appear over time.","body":"\u003cp>A soak test runs a system at steady, realistic load for an extended period, typically hours or days, to expose problems that only appear over time. It is also called an endurance test. A short \u003ca href=\"#Load%20testing\" data-term=\"Load testing\">load test\u003c/a> can pass while the system is slowly heading toward failure.\u003c/p>\u003cp>Soak tests find a specific class of defect:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Problem\u003c/th>\u003cth>What you see over time\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Memory%20leak\" data-term=\"Memory leak\">Memory leak\u003c/a>\u003c/td>\u003ctd>Memory floor climbs until the process is killed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Connection leak\u003c/td>\u003ctd>Open connections rise until the pool runs out\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disk growth\u003c/td>\u003ctd>\u003ca href=\"#Log\" data-term=\"Log\">Logs\u003c/a> or temp files fill the disk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Data growth\u003c/td>\u003ctd>Queries slow down as tables grow\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Time-based events\u003c/td>\u003ctd>Token expiry, scheduled jobs, log rotation\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The recognisable symptom is a service that runs well after each deployment and dies after a few days. Teams that deploy often may never see the problem, because each release restarts the process and resets the clock. It then surfaces during a holiday change freeze, when the service runs uninterrupted for longer than it ever has.\u003c/p>\u003cp>Run the test at roughly typical production load. Make it longer than the longest cycle you care about. If a batch job runs daily or an access token lasts 24 hours, a soak of under a day will not exercise them.\u003c/p>\u003cp>Watch the trend instead of the level. Graph each \u003ca href=\"#Gauge\" data-term=\"Gauge\">gauge\u003c/a> for memory, connections, threads and disk, and compare the first hour with the last. A flat line is healthy, and a slope gives a time to failure. In a hypothetical test where memory grows 20 MB per hour with 1.6 GB free, the process runs out after 80 hours. An 8-hour soak would not crash, but its slope reveals the problem.\u003c/p>","avoid":"","usage":["It passed the load test, but in production it falls over every four days.","An hour-long test can't catch that. Run a soak test over the weekend and watch the memory and connection graphs."],"out":[48,55,15,19]},{"name":"Little's Law","section":5,"description":"A queueing rule. The average number of items in a system equals the arrival rate times the average time each item spends there.","body":"\u003cp>Little's Law states that the average number of items in a stable system equals the average arrival rate multiplied by the average time each item spends in the system. John Little published a proof in 1961.\u003c/p>\u003cpre>\u003ccode>L = λ × W\u003c/code>\u003c/pre>\u003cp>L is the average number in the system, λ (lambda) is the arrival rate, and W is the average time in the system. The units must match, so convert milliseconds to seconds when the rate is per second. The law holds whatever the arrival pattern or distribution of service times, as long as the system is stable over the period measured.\u003c/p>\u003cp>It answers common sizing questions, shown here with hypothetical numbers:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Question\u003c/th>\u003cth>Calculation\u003c/th>\u003cth>Answer\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Requests in flight at 200 per second and 250 ms?\u003c/td>\u003ctd>200 x 0.25\u003c/td>\u003ctd>50 concurrent\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Maximum rate for 100 connections held 50 ms each?\u003c/td>\u003ctd>100 / 0.05\u003c/td>\u003ctd>2,000 per second\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The law explains a confusing kind of outage, where a slow dependency exhausts threads in a service that has no bug. At 200 requests per second and 250 ms, a service holds 50 requests in flight. If a dependency slows and requests now take one second, the same traffic needs 200 in flight. With a pool of 100 threads, requests begin to queue or fail although traffic never changed.\u003c/p>\u003cp>The law describes averages, so it says nothing about \u003ca href=\"#Percentile\" data-term=\"Percentile\">percentiles\u003c/a> or short bursts, and sizing needs headroom on top. It does not apply while arrivals exceed completions, because the queue keeps growing and no steady average exists. Related limits appear as \u003ca href=\"#Saturation\" data-term=\"Saturation\">saturation\u003c/a> and \u003ca href=\"#Queueing%20delay\" data-term=\"Queueing delay\">queueing delay\u003c/a>.\u003c/p>","avoid":"","usage":["How big should the connection pool be for the new service?","Little's Law says 500 queries a second at 20 ms is 10 in flight on average. Start around 20 for bursts and watch wait time."],"out":[21,31,52]},{"name":"Queueing delay","section":5,"description":"Time a request spends waiting for a busy resource before work on it starts. It grows sharply near full utilisation.","body":"\u003cp>Queueing delay is the time a request spends waiting for a busy resource before any work on it begins. Total latency is queueing delay plus service time, the time spent doing the work.\u003c/p>\u003cp>A simple queueing model, known as M/M/1, assumes one server, random arrivals and exponentially distributed service times. In this model the average total time is S / (1 - U), where S is service time and U is utilisation. With a 10 ms service time:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Utilisation\u003c/th>\u003cth>Average wait\u003c/th>\u003cth>Average total\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>50%\u003c/td>\u003ctd>10 ms\u003c/td>\u003ctd>20 ms\u003c/td>\u003c/tr>\u003ctr>\u003ctd>80%\u003c/td>\u003ctd>40 ms\u003c/td>\u003ctd>50 ms\u003c/td>\u003c/tr>\u003ctr>\u003ctd>90%\u003c/td>\u003ctd>90 ms\u003c/td>\u003ctd>100 ms\u003c/td>\u003c/tr>\u003ctr>\u003ctd>95%\u003c/td>\u003ctd>190 ms\u003c/td>\u003ctd>200 ms\u003c/td>\u003c/tr>\u003ctr>\u003ctd>99%\u003c/td>\u003ctd>990 ms\u003c/td>\u003ctd>1,000 ms\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Moving from 90% to 99% utilisation is 10% more traffic and ten times the latency. Real systems have different numbers, since multiple workers soften the curve and bursty traffic worsens it, but the shape holds.\u003c/p>\u003cp>The symptom is a service that is fine all day until a small rise at peak makes latency jump. Engineers search for a bad query or a recent deployment that does not exist. Each request takes no longer to process once it starts, so \u003ca href=\"#Profiling\" data-term=\"Profiling\">profiling\u003c/a> shows nothing new. In a \u003ca href=\"#Distributed%20trace\" data-term=\"Distributed trace\">distributed trace\u003c/a>, the time appears as a gap before a \u003ca href=\"#Span\" data-term=\"Span\">span\u003c/a> begins or between client and server spans.\u003c/p>\u003cp>To respond, keep utilisation below the steep part of the curve through \u003ca href=\"#Capacity%20planning\" data-term=\"Capacity planning\">capacity planning\u003c/a>, reduce service time or add workers. Bound queues and reject work when they fill, because a request served after its client has given up is wasted. Track queue depth or wait time as a \u003ca href=\"#Saturation\" data-term=\"Saturation\">saturation\u003c/a> signal. \u003ca href=\"#Little's%20Law\" data-term=\"Little's Law\">Little's Law\u003c/a> connects the two: 30 requests waiting at 200 per second means a 150 ms average wait.\u003c/p>","avoid":"","usage":["Traffic is up 8% and p99 tripled. Did someone ship something?","Nothing shipped. We're at 92% utilisation, so that's queueing delay. Add two instances and it should drop."],"out":[56,23,24,47,31,51]},{"name":"Coordinated omission","section":5,"description":"A load-testing error where the tool sends fewer requests during a stall, so the slowest latencies go unrecorded.","body":"\u003cp>Coordinated omission is a measurement error in which a load generator slows down when the system under test slows down, and so never records the latency of requests it should have sent. Gil Tene gave the problem its name. It makes \u003ca href=\"#Tail%20latency\" data-term=\"Tail latency\">tail latency\u003c/a> look far better than it is.\u003c/p>\u003cp>The mechanism is a closed loop. Many tools wait for each response before sending the next request. During a stall, the tool sends nothing, so the tool and the server in effect cooperate to leave out samples at the moment the measurements would be worst.\u003c/p>\u003cp>Take a hypothetical test intended to send 100 requests per second for 60 seconds over one connection. Responses normally take 5 ms, and the server stalls once for 10 seconds.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Measure\u003c/th>\u003cth>Recorded by closed-loop tool\u003c/th>\u003cth>Measured from intended send times\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Requests counted\u003c/td>\u003ctd>5,001\u003c/td>\u003ctd>6,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Requests delayed by stall\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Percentile\" data-term=\"Percentile\">p99\u003c/a>\u003c/td>\u003ctd>5 ms\u003c/td>\u003ctd>About 9.4 s\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Maximum\u003c/td>\u003ctd>10 s\u003c/td>\u003ctd>10 s\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The 1,000 requests scheduled during the stall would have waited between nearly 0 and 10 seconds. The tool saw only one of them.\u003c/p>\u003cp>The symptom is a \u003ca href=\"#Load%20testing\" data-term=\"Load testing\">load test\u003c/a> reporting a p99 of a few milliseconds while users see multi-second pauses in production. A high maximum next to a low p99 is a warning sign.\u003c/p>\u003cp>To avoid it, use an open-loop generator that launches requests on a fixed schedule regardless of outstanding responses, and measure latency from the intended start time.\u003c/p>\u003cp>Production measurement can have the same blind spot. A service that starts its timer when a handler begins does not count \u003ca href=\"#Queueing%20delay\" data-term=\"Queueing delay\">queueing delay\u003c/a> before that point. Measure at the client or load balancer as well.\u003c/p>","avoid":"","usage":["The benchmark says p99 is 4 ms, but we saw a ten-second GC pause during the run.","Then it's coordinated omission. The tool stopped sending during the pause, so rerun it with a constant arrival rate."],"out":[32,21,48,52]},{"name":"Thundering herd","section":5,"description":"Many clients acting at the same moment, such as after a cache expiry or outage, and overwhelming a shared resource.","body":"\u003cp>A thundering herd is many clients or processes acting at the same moment and overwhelming a shared resource. Something usually synchronises them: a cache expiry, a service restart, a scheduled job or a reconnect after a failure.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Trigger\u003c/th>\u003cth>What happens\u003c/th>\u003cth>Countermeasure\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Popular cache key expires\u003c/td>\u003ctd>Every request hits the database at once\u003c/td>\u003ctd>Request coalescing, where one fetches and others wait\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Many keys share one lifetime\u003c/td>\u003ctd>They all expire together\u003c/td>\u003ctd>Add a random offset to each expiry\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Service recovers from outage\u003c/td>\u003ctd>All clients reconnect and retry\u003c/td>\u003ctd>Exponential backoff with jitter\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Midnight scheduled job\u003c/td>\u003ctd>The whole fleet runs it simultaneously\u003c/td>\u003ctd>Randomise start times\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cold restart\u003c/td>\u003ctd>Empty caches send all reads downstream\u003c/td>\u003ctd>Warm caches and ramp traffic gradually\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The recognisable symptom is a service that comes back after an outage and immediately falls over again. Engineers restart it, it survives for seconds, and the cycle repeats. Load at recovery can exceed the normal peak, because clients have accumulated retries and every one of them tries at once.\u003c/p>\u003cp>Randomness breaks the synchronisation. If 1,000 clients each retry after exactly 5 seconds, the server receives 1,000 requests in the same instant, round after round. Spreading those retries randomly over 30 seconds gives about 33 per second. This random spread is called jitter. Exponential backoff, which lengthens the wait after each failure, is not enough alone, because clients that failed together still retry together at 1, 2 and 4 seconds.\u003c/p>\u003cp>During recovery, the usual \u003ca href=\"#Mitigation\" data-term=\"Mitigation\">mitigation\u003c/a> is to admit traffic in stages at the load balancer and reject the excess until caches are warm. The recovery phase of \u003ca href=\"#Stress%20testing\" data-term=\"Stress testing\">stress testing\u003c/a> can expose this behaviour in advance.\u003c/p>","avoid":"","usage":["We brought the API back and it died again in thirty seconds.","That's a thundering herd, every mobile client is retrying at once. Let traffic in 10% at a time and add jitter to the client backoff."],"out":[44,49]},{"name":"Memory leak","section":5,"description":"Memory a program keeps allocated after it stops needing it, so usage climbs until the process slows or is killed.","body":"\u003cp>A memory leak is memory that a program keeps allocated after it no longer needs it, so usage climbs until the process slows down or is killed. In manually managed languages such as C, it is memory that was never freed. In garbage-collected languages, the collector cannot release anything still referenced, so a leak is usually an object kept reachable by accident. Common causes are unbounded caches, global maps keyed by request or user, event listeners never removed, and threads blocked forever while holding references.\u003c/p>\u003cp>The usual symptom is that a restart fixes everything for a while. The memory \u003ca href=\"#Gauge\" data-term=\"Gauge\">gauge\u003c/a> climbs steadily, the process is killed for exceeding its limit, it restarts, and the cycle repeats at a regular interval.\u003c/p>\u003cp>The shape of the memory graph helps separate a leak from normal behaviour:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Pattern\u003c/th>\u003cth>Likely meaning\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Sawtooth with a flat floor\u003c/td>\u003ctd>Normal garbage collection\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sawtooth with a rising floor\u003c/td>\u003ctd>Leak\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rises, then plateaus\u003c/td>\u003ctd>A cache filling to its limit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sudden step with a traffic burst\u003c/td>\u003ctd>Large allocation, not necessarily a leak\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Process memory grows, heap flat\u003c/td>\u003ctd>Native memory use or fragmentation\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Small leaks add up under traffic. If each request retains 2 KB at a hypothetical 100 requests per second, the process leaks 200 KB per second, or 720 MB per hour. A container with a 2 GB limit and a 500 MB baseline has 1.5 GB of headroom and would be killed after about two hours.\u003c/p>\u003cp>To diagnose a leak, take two heap snapshots some time apart under load, compare which object types grew, and find what is holding references to them. Heap \u003ca href=\"#Profiling\" data-term=\"Profiling\">profiling\u003c/a> supports this directly. A \u003ca href=\"#Soak%20test\" data-term=\"Soak test\">soak test\u003c/a> can reproduce the problem before release, whereas frequent deployments can hide it by restarting the process.\u003c/p>","avoid":"","usage":["The worker gets OOM-killed every six hours, like clockwork.","Sounds like a memory leak. Grab two heap dumps an hour apart and diff them to see what's growing."],"out":[19,56,50]},{"name":"Profiling","section":5,"description":"Measuring where a running program spends CPU, memory or waiting time, down to individual functions.","body":"\u003cp>Profiling is measuring where a running program spends resources, such as CPU time, memory or waiting time, down to the level of individual functions. It replaces guesses about performance with data. The familiar failure it prevents is spending two days optimising a function that turns out to account for 1% of runtime, where even a perfect fix could save at most 1%.\u003c/p>\u003cp>Different profile types answer different questions:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Question\u003c/th>\u003cth>Useful when\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>CPU\u003c/td>\u003ctd>Which code is on the CPU?\u003c/td>\u003ctd>High CPU or slow computation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Heap\u003c/td>\u003ctd>What is holding memory now?\u003c/td>\u003ctd>Investigating a \u003ca href=\"#Memory%20leak\" data-term=\"Memory leak\">memory leak\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Allocation\u003c/td>\u003ctd>What allocates the most?\u003c/td>\u003ctd>Heavy garbage collection\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Off-CPU\u003c/td>\u003ctd>Where are threads blocked?\u003c/td>\u003ctd>Slow service with low CPU\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Profilers work in two main ways. A \u003ca href=\"#Sampling\" data-term=\"Sampling\">sampling\u003c/a> profiler interrupts the program at a fixed frequency, such as 99 times per second, and records the call stack. Its overhead is low, and functions that use a lot of time appear in many samples. An instrumenting profiler records every function entry and exit, which is exact but slower and can distort the behaviour being measured. Sampling is the usual choice in production.\u003c/p>\u003cp>A CPU profile does not show waiting. A request that uses 10 ms of CPU and blocks for 900 ms on a database barely appears in it, which is why a slow service can produce a CPU profile with nothing interesting in it. Use an off-CPU profile or a \u003ca href=\"#Distributed%20trace\" data-term=\"Distributed trace\">distributed trace\u003c/a> for that case.\u003c/p>\u003cp>Continuous profiling runs low-overhead sampling across production all the time. It lets you compare before and after a deployment, or inspect the moment of an \u003ca href=\"#Incident\" data-term=\"Incident\">incident\u003c/a> without reproducing it. Results are commonly displayed as a \u003ca href=\"#Flame%20graph\" data-term=\"Flame graph\">flame graph\u003c/a>.\u003c/p>","avoid":"","usage":["I'm going to rewrite the JSON parser, it has to be what's slow.","Profile it first. Last time we guessed, the parser was 2% of CPU and the real cost was in logging."],"out":[55,26,23,41,57]},{"name":"Flame graph","section":5,"description":"A chart of profiled call stacks where each box's width shows its share of samples, used to find expensive code.","body":"\u003cp>A flame graph is a visualisation of \u003ca href=\"#Profiling\" data-term=\"Profiling\">profiling\u003c/a> data that shows sampled call stacks, with each box's width proportional to the share of samples in which that function appeared. Brendan Gregg created the format.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Element\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Box\u003c/td>\u003ctd>One function in the call stack\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Width\u003c/td>\u003ctd>Share of samples containing this function and its callees\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Vertical position\u003c/td>\u003ctd>Stack depth, with each callee drawn above its caller\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Left-to-right order\u003c/td>\u003ctd>Usually alphabetical, and not related to time\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Colour\u003c/td>\u003ctd>Usually only separates boxes visually\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The common misreading is to treat the horizontal axis as time. Two boxes side by side did not necessarily run one after the other. A view that does plot time horizontally is called a flame chart, as seen in browser developer tools, and it answers a different question.\u003c/p>\u003cp>Look for wide boxes with little or nothing above them. Those functions were themselves on the CPU for that share of samples. A wide box covered by children spent its time in those children. New readers often see the broad \u003ccode>main\u003c/code> or \u003ccode>handleRequest\u003c/code> box at the bottom and conclude it is the problem, when it is only the caller of everything above it.\u003c/p>\u003cp>Width converts to a limit on savings. If \u003ccode>serialize\u003c/code> covers 35% of the graph, making it twice as fast saves at most about 17.5% of CPU.\u003c/p>\u003cp>Differential flame graphs compare two profiles, such as before and after a deployment, and colour the functions that grew or shrank. They are a direct way to investigate a performance regression.\u003c/p>\u003cp>A CPU flame graph shows only on-CPU work, so a service blocked on a database looks idle in it. An off-CPU variant covers blocking.\u003c/p>","avoid":"","usage":["The flame graph shows handleRequest at 95%. So that's our slow function?","No, that's just the root of the stack. Look at the wide plateau near the top, it's regex compilation at 30%."],"out":[56]},{"name":"Chaos engineering","section":6,"description":"Deliberately injecting failures into a system in a controlled way to test whether it behaves as expected.","body":"\u003cp>Chaos engineering is the practice of deliberately injecting failures into a system, as a controlled experiment, to test whether it behaves as expected. It grew out of work at Netflix, whose Chaos Monkey tool randomly terminated production instances.\u003c/p>\u003cp>The practice is an experiment with a defined method:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Action\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Define steady state\u003c/td>\u003ctd>Checkout success stays at or above 99.9%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Form a hypothesis\u003c/td>\u003ctd>Losing one cache node will not affect checkout\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Limit the blast radius\u003c/td>\u003ctd>1% of traffic in one zone\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Set abort conditions\u003c/td>\u003ctd>Stop if the \u003ca href=\"#SLI\" data-term=\"SLI\">SLI\u003c/a> drops below target\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Inject the fault\u003c/td>\u003ctd>Terminate a cache node\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Observe and compare\u003c/td>\u003ctd>Did steady state hold?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>Fix and repeat\u003c/td>\u003ctd>Address what was learned\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The problem it addresses is redundancy that has never been exercised. A team has a standby database and a failover procedure that has never run. On the day the primary fails, the standby turns out to have stale configuration or too little capacity.\u003c/p>\u003cp>Typical injected faults include instance termination, added network latency, packet loss, dependency errors, DNS failures, full disks and clock skew. Added latency is often more revealing than a crash, because a slow dependency ties up threads and connections while a dead one fails quickly.\u003c/p>\u003cp>Some preconditions apply. You need enough \u003ca href=\"#Observability\" data-term=\"Observability\">observability\u003c/a> to see the effect, an \u003ca href=\"#SLO\" data-term=\"SLO\">SLO\u003c/a> to define normal, and a fast way to stop. If you already expect the system to fail the experiment, fix it first. Start in staging and move to production as confidence grows, since only production has real traffic and configuration.\u003c/p>\u003cp>Experiments that affect users spend \u003ca href=\"#Error%20budget\" data-term=\"Error budget\">error budget\u003c/a>, so run them when budget is available. A \u003ca href=\"#Game%20day\" data-term=\"Game day\">game day\u003c/a> complements this work by exercising the people as well as the software.\u003c/p>","avoid":"","usage":["We've got three replicas, so losing one is fine.","Have we ever tried it? Let's run a chaos engineering experiment on 1% of traffic and see whether failover works."],"out":[3,12,4,6,59]},{"name":"Game day","section":6,"description":"A scheduled exercise in which a team simulates a failure and practises detecting, responding to and recovering from it.","body":"\u003cp>A game day is a scheduled exercise in which a team simulates a failure and practises detecting it, responding to it and recovering from it. \u003ca href=\"#Chaos%20engineering\" data-term=\"Chaos engineering\">Chaos engineering\u003c/a> tests how software behaves. A game day also tests people, tools and procedures.\u003c/p>\u003cp>An exercise usually runs through these phases:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Phase\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Plan\u003c/td>\u003ctd>Choose the scenario, scope, participants and abort criteria\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Brief\u003c/td>\u003ctd>Tell stakeholders the time and the possible impact\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Inject\u003c/td>\u003ctd>A facilitator triggers or simulates the failure\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Respond\u003c/td>\u003ctd>\u003ca href=\"#On-call\" data-term=\"On-call\">On-call\u003c/a> engineers work it as a real \u003ca href=\"#Incident\" data-term=\"Incident\">incident\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Recover\u003c/td>\u003ctd>Restore normal operation and confirm the system is healthy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Debrief\u003c/td>\u003ctd>Record the gaps and assign actions\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The problem it addresses is discovering a broken procedure during a real outage. The first attempt to restore a database from backup should not be the one that reveals the backup is corrupt or that the restore takes nine hours. Game days also expose missing credentials, an out-of-date \u003ca href=\"#Runbook\" data-term=\"Runbook\">runbook\u003c/a>, an \u003ca href=\"#Alert\" data-term=\"Alert\">alert\u003c/a> that never fires, dashboards some responders cannot open, and uncertainty over who may make a decision.\u003c/p>\u003cp>The format can match the team's maturity. A tabletop exercise talks through the scenario without touching any system and costs little. A staging exercise runs real actions safely. A production exercise is the closest to reality and needs strong safeguards.\u003c/p>\u003cp>Keep the exercise realistic. Use the normal tools, practise the \u003ca href=\"#Incident%20commander\" data-term=\"Incident commander\">incident commander\u003c/a> role, and have an observer note where people got stuck. Label all communication as an exercise so nobody mistakes it for a real outage, and stop at once if a real incident begins.\u003c/p>\u003cp>Track the resulting actions as you would those from a \u003ca href=\"#Blameless%20postmortem\" data-term=\"Blameless postmortem\">blameless postmortem\u003c/a>. Repeat the exercise periodically, because systems and teams change.\u003c/p>","avoid":"","usage":["Our DR plan says we can restore in an hour. Has anyone timed it?","No. Let's schedule a game day next month, restore last night's backup and see how long it takes."],"out":[58,39,41,40,35,43,45]},{"name":"DORA metrics","section":6,"description":"Measures of software delivery performance from the DORA research programme, covering throughput and instability.","body":"\u003cp>DORA metrics are measures of software delivery performance from the DevOps Research and Assessment (DORA) programme. The research originally identified four key metrics. DORA renamed and narrowed one of them in 2023 and added a fifth in 2024.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Metric\u003c/th>\u003cth>Group\u003c/th>\u003cth>What it measures\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Change lead time\u003c/td>\u003ctd>Throughput\u003c/td>\u003ctd>Time from commit to running in production\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Deployment frequency\u003c/td>\u003ctd>Throughput\u003c/td>\u003ctd>How often deployments happen\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Failed deployment recovery time\u003c/td>\u003ctd>Throughput\u003c/td>\u003ctd>Time to recover from a deployment needing immediate intervention\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Change%20failure%20rate\" data-term=\"Change failure rate\">Change fail rate\u003c/a>\u003c/td>\u003ctd>Instability\u003c/td>\u003ctd>Share of deployments needing immediate intervention\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Deployment rework rate\u003c/td>\u003ctd>Instability\u003c/td>\u003ctd>Share of deployments that are unplanned and caused by a production \u003ca href=\"#Incident\" data-term=\"Incident\">incident\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Failed deployment recovery time replaced &quot;time to restore service&quot;. It counts only failures caused by a change, so it excludes events such as a data centre outage, and it is narrower than a general \u003ca href=\"#MTTR\" data-term=\"MTTR\">MTTR\u003c/a>.\u003c/p>\u003cp>DORA's research has found that throughput and stability tend to go together: teams that deploy frequently in small batches generally also have fewer and shorter failures.\u003c/p>\u003cp>The usual misuse is turning these measures into targets or league tables. Once deployment frequency is a goal, teams split releases into trivial deployments. Once failure rate is a goal, failures get reclassified as something else. Comparisons between teams also mislead, since a mobile app that waits on store review and a web service have different constraints. Use the metrics to follow one team's trend and to find its bottleneck.\u003c/p>\u003cp>Agree what counts as a deployment and a failure, and pull the data from the deployment pipeline and incident tracker.\u003c/p>\u003cp>These metrics describe delivery and say nothing directly about user experience. Pair them with an \u003ca href=\"#SLO\" data-term=\"SLO\">SLO\u003c/a>, since a team can score well on DORA while its service misses its reliability target.\u003c/p>","avoid":"","usage":["The VP wants every team ranked on DORA metrics this quarter.","Then we'll get lots of one-line deploys. Let's show each team's own trend and use it to find where changes get stuck."],"out":[61,41,10,4]},{"name":"Change failure rate","section":6,"description":"The share of deployments that need immediate intervention afterwards, such as a rollback or hotfix.","body":"\u003cp>Change failure rate is the share of deployments to production that need immediate intervention afterwards, such as a rollback or hotfix. It is one of the \u003ca href=\"#DORA%20metrics\" data-term=\"DORA metrics\">DORA metrics\u003c/a>, where it is named &quot;change fail rate&quot;. The formula is failed deployments divided by total deployments. If a team ships 120 deployments in a quarter and 6 need a rollback or hotfix, the rate is 5%.\u003c/p>\u003cp>The number depends on what the team counts as a failure:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Event\u003c/th>\u003cth>Usually counts?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Deployment rolled back because of errors\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hotfix shipped to correct a release\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Caught by a canary, a release sent to a small share of traffic first\u003c/td>\u003ctd>Depends, so record the policy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Bug found weeks later and fixed in normal work\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Outage caused by a cloud provider\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Planned rollback for business reasons\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Without agreed definitions, the figure can drift away from reality. The telltale sign is a rate of 1% on a team whose engineers remember constant firefighting. Often failures are being fixed forward in later releases and never labelled as failures. Linking deployments to \u003ca href=\"#Incident\" data-term=\"Incident\">incidents\u003c/a> and to hotfix commits gives a more honest count.\u003c/p>\u003cp>The rate says nothing about severity. A change that takes down checkout counts the same as one with a minor effect, so read it alongside \u003ca href=\"#Error%20budget\" data-term=\"Error budget\">error budget\u003c/a> spend and recovery time.\u003c/p>\u003cp>Deploying less often to reduce failures tends to backfire. Larger batches carry more change per release and are harder to diagnose when they go wrong. To lower the rate, make changes smaller, strengthen automated tests, validate configuration, release to a growing share of traffic, and act on the \u003ca href=\"#Contributing%20factor\" data-term=\"Contributing factor\">contributing factors\u003c/a> found in past failures.\u003c/p>","avoid":"","usage":["Our change failure rate is 2%, so why does \u003ca href=\"#On-call\" data-term=\"On-call\">on-call\u003c/a> feel so bad?","We only count rollbacks. Half our bad releases get patched forward, so let's count those hotfixes too."],"out":[60,41,6,46,39]},{"name":"Production readiness review","section":6,"description":"A structured check that a service can be run safely in production before it launches or changes owners.","body":"\u003cp>A production readiness review (PRR) is a structured check that a service can be run safely in production, done before it launches or before another team takes responsibility for it. Google's \u003ca href=\"#Site%20reliability%20engineering\" data-term=\"Site reliability engineering\">site reliability engineering\u003c/a> teams helped popularise the practice.\u003c/p>\u003cp>A review typically covers these areas:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Area\u003c/th>\u003cth>Questions\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Targets\u003c/td>\u003ctd>Are \u003ca href=\"#SLI\" data-term=\"SLI\">SLIs\u003c/a> and \u003ca href=\"#SLO\" data-term=\"SLO\">SLOs\u003c/a> defined?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Visibility\u003c/td>\u003ctd>Is there enough \u003ca href=\"#Observability\" data-term=\"Observability\">observability\u003c/a> to debug it?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Alerting\u003c/td>\u003ctd>Does each \u003ca href=\"#Alert\" data-term=\"Alert\">alert\u003c/a> reflect user impact and link a \u003ca href=\"#Runbook\" data-term=\"Runbook\">runbook\u003c/a>?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Capacity\u003c/td>\u003ctd>Has \u003ca href=\"#Load%20testing\" data-term=\"Load testing\">load testing\u003c/a> established its limits?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Failure handling\u003c/td>\u003ctd>What happens when each dependency fails?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Change safety\u003c/td>\u003ctd>Can a release be rolled back quickly?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Data\u003c/td>\u003ctd>Are backups taken, and has a restore been tested?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Security\u003c/td>\u003ctd>How are secrets and access managed?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ownership\u003c/td>\u003ctd>Who is \u003ca href=\"#On-call\" data-term=\"On-call\">on-call\u003c/a>, and do they know the service?\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The problem it prevents is a service that ships on a Friday and pages someone who has never seen it. There are no dashboards, no runbook and no list of dependencies, so the team discovers each gap during its first \u003ca href=\"#Incident\" data-term=\"Incident\">incident\u003c/a>. A review moves that discovery to a point where fixes are cheaper.\u003c/p>\u003cp>Timing affects the outcome. A review held a week before launch produces a list nobody has time to address, so start the conversation at the design stage. The output should separate blocking items, which must be fixed before launch, from non-blocking items tracked with owners and dates. When a team launches with a known gap, a named person should accept that risk explicitly.\u003c/p>\u003cp>A review can also decay into bureaucracy, where a long generic checklist becomes box-ticking and teams route around it. Scale the rigour to how critical the service is, so an internal tool gets a lighter review than a payment path.\u003c/p>","avoid":"","usage":["We're launching the new billing service next Tuesday. Can SRE take the pager?","Not before a production readiness review. Right now it has no runbook, no SLO and an untested restore."],"out":[0,3,4,12,35,40,48,39,41]}]}
    </script>
    <script>
      (() => {
        const data = JSON.parse(
          document.getElementById("graph-data").textContent
        );
        const $ = (id) => document.getElementById(id);
        const stage = $("stage");
        const panel = $("panel");
        const panelBody = $("panel-body");
        const resizer = $("resizer");
        const search = $("search");
        const input = $("search-input");
        const results = $("results");
        const info = $("info");
        const infoBtn = $("info-btn");
        const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

        const INK = "#1c1c1a";
        const BG = "#ededE9";
        // Hubs keep their label even when it crosses another circle.
        const HUB_WEIGHT = 0.7;
        const esc = (s) =>
          s.replace(
            /[&<>"]/g,
            (c) =>
              ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]
          );
        const hashFor = (name) => "#" + encodeURIComponent(name);

        const nodes = data.terms.map((term, i) => ({
          ...term,
          id: i,
          incoming: [],
        }));
        const links = [];
        const linkKeys = new Set();
        nodes.forEach((n) =>
          n.out.forEach((t) => {
            nodes[t].incoming.push(n.id);
            links.push({ source: n.id, target: t, from: n.id, to: t });
            linkKeys.add(n.id + ">" + t);
          })
        );
        // A two-way pair is drawn as one line; both directions keep their particles.
        links.forEach((l) => {
          l.hiddenTwin = l.from > l.to && linkKeys.has(l.to + ">" + l.from);
        });

        const maxIncoming = Math.max(...nodes.map((n) => n.incoming.length), 1);
        const sectionCount = data.sections.length;
        const stageBox = stage.getBoundingClientRect();
        const landscape = stageBox.width >= stageBox.height;
        const anchorRadiusX = landscape ? 360 : 170;
        const anchorRadiusY = landscape ? 190 : 320;
        nodes.forEach((n, i) => {
          const weight = Math.sqrt(n.incoming.length / maxIncoming);
          const shade = Math.round(214 - weight * 158);
          n.weight = weight;
          n.r = 4 + Math.sqrt(n.incoming.length) * 2.9;
          n.fill = `rgb(${shade},${shade},${shade - 3})`;
          n.neighbors = new Set([n.id, ...n.out, ...n.incoming]);
          const angle = (n.section / sectionCount) * Math.PI * 2;
          n.anchorX = sectionCount > 1 ? Math.cos(angle) * anchorRadiusX : 0;
          n.anchorY = sectionCount > 1 ? Math.sin(angle) * anchorRadiusY : 0;
          n.x = n.anchorX + Math.cos(i * 2.4) * (30 + i);
          n.y = n.anchorY + Math.sin(i * 2.4) * (30 + i);
        });
        const byName = new Map(nodes.map((n) => [n.name, n]));

        let selected = null;
        let hovered = null;
        let userMoved = false;
        let pauseTimer = 0;
        let particleFocus = null;
        // The selected term keeps the highlight; hovering only adds to it.
        const focusNode = () => selected || hovered;
        const isVisible = (n, f) =>
          !f || f.neighbors.has(n.id) || n === hovered;
        const endpoint = (v) => (typeof v === "object" ? v.id : v);
        const isFocusLink = (l) => {
          const f = focusNode();
          return (
            !!f && (endpoint(l.source) === f.id || endpoint(l.target) === f.id)
          );
        };

        function collideForce() {
          let all = [];
          const force = () => {
            for (let i = 0; i < all.length; i++) {
              for (let j = i + 1; j < all.length; j++) {
                const a = all[i],
                  b = all[j];
                const dx = b.x - a.x || 0.01,
                  dy = b.y - a.y || 0.01;
                const d = Math.hypot(dx, dy);
                const min = a.r + b.r + 9;
                if (d >= min) continue;
                const push = ((min - d) / d) * 0.5;
                b.x += dx * push;
                b.y += dy * push;
                a.x -= dx * push;
                a.y -= dy * push;
              }
            }
          };
          force.initialize = (n) => {
            all = n;
          };
          return force;
        }

        function sectionForce() {
          let all = [];
          const force = (alpha) =>
            all.forEach((n) => {
              n.vx += (n.anchorX - n.x) * 0.035 * alpha;
              n.vy += (n.anchorY - n.y) * 0.035 * alpha;
            });
          force.initialize = (n) => {
            all = n;
          };
          return force;
        }

        function drawNode(n, ctx, k) {
          const near = isVisible(n, focusNode());
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
          if (!near) {
            // An opaque base stops lines showing through dimmed circles.
            ctx.fillStyle = BG;
            ctx.fill();
          }
          ctx.globalAlpha = near ? 1 : 0.15;
          ctx.fillStyle = n.fill;
          ctx.fill();
          ctx.globalAlpha = 1;
          if (n === selected) {
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.r + 3.2 / Math.max(k, 0.6), 0, Math.PI * 2);
            ctx.strokeStyle = INK;
            ctx.lineWidth = 1.4 / k;
            ctx.stroke();
          }
        }

        function drawLabels(ctx, k) {
          const f = focusNode();
          const rank = (n) =>
            (n === hovered
              ? 4
              : n === f
                ? 3
                : f && f.neighbors.has(n.id)
                  ? 2
                  : 0) + n.weight;
          const placed = [];
          const order = nodes
            .filter((n) => isVisible(n, f))
            .sort((a, b) => rank(b) - rank(a));
          const hitsCircle = (box, self) =>
            order.some((m) => {
              if (m === self) return false;
              const cx = Math.max(box.l, Math.min(m.x, box.r));
              const cy = Math.max(box.t, Math.min(m.y, box.b));
              return Math.hypot(m.x - cx, m.y - cy) < m.r;
            });
          ctx.textAlign = "center";
          ctx.textBaseline = "bottom";
          ctx.lineJoin = "round";
          for (const n of order) {
            const pinned = n === f || n === hovered;
            const px = n === f ? 15 : n === hovered ? 13 : 8.5 + n.weight * 5.5;
            const size = px / k;
            ctx.font = `${size}px ui-monospace, "SF Mono", Menlo, Consolas, monospace`;
            if ("letterSpacing" in ctx) ctx.letterSpacing = `${size * 0.06}px`;
            const text = n.name.toUpperCase();
            const w = ctx.measureText(text).width;
            const y = n.y - n.r - 5 / k;
            const box = {
              l: n.x - w / 2 - 3 / k,
              r: n.x + w / 2 + 3 / k,
              t: y - size - 1 / k,
              b: y + 1 / k,
            };
            if (
              !pinned &&
              ((n.weight < HUB_WEIGHT && hitsCircle(box, n)) ||
                placed.some(
                  (p) =>
                    box.l < p.r && box.r > p.l && box.t < p.b && box.b > p.t
                ))
            )
              continue;
            placed.push(box);
            ctx.globalAlpha = 0.9;
            ctx.strokeStyle = BG;
            ctx.lineWidth = 3.5 / k;
            ctx.strokeText(text, n.x, y);
            ctx.globalAlpha = pinned ? 1 : f ? 0.82 : 0.38 + n.weight * 0.55;
            ctx.fillStyle = INK;
            ctx.fillText(text, n.x, y);
          }
          ctx.globalAlpha = 1;
          if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
        }

        const graph = new ForceGraph($("graph"))
          .backgroundColor("rgba(0,0,0,0)")
          .nodeId("id")
          .nodeLabel(() => "")
          .nodeCanvasObject(drawNode)
          .nodePointerAreaPaint((n, color, ctx) => {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.r + 2, 0, Math.PI * 2);
            ctx.fill();
          })
          .linkColor((l) => {
            if (l.hiddenTwin) return "rgba(0,0,0,0)";
            if (!focusNode()) return "rgba(28,28,26,.09)";
            return isFocusLink(l) ? "rgba(28,28,26,.5)" : "rgba(28,28,26,.025)";
          })
          .linkWidth((l) => (isFocusLink(l) ? 0.9 : 0.5))
          .linkDirectionalParticles((l) =>
            !reducedMotion.matches && isFocusLink(l) ? 2 : 0
          )
          .linkDirectionalParticleWidth(2.2)
          .linkDirectionalParticleSpeed(0.005)
          .linkDirectionalParticleColor(() => INK)
          .minZoom(0.25)
          .maxZoom(6)
          .warmupTicks(280)
          .cooldownTicks(70)
          .onRenderFramePost(drawLabels)
          .onNodeClick((n) => go(n.name))
          .onBackgroundClick(() => go(null))
          .onNodeHover((n) => {
            hovered = n || null;
            wake();
          })
          .onNodeDragEnd((n) => {
            n.fx = undefined;
            n.fy = undefined;
          })
          .onZoom((t) => {
            if (t && programmaticUntil < performance.now()) userMoved = true;
          });

        graph.d3Force("charge").strength(-340).distanceMax(760);
        graph
          .d3Force("link")
          .distance((l) => 46 + l.source.r + l.target.r)
          .strength(
            (l) =>
              0.55 / Math.min(l.source.neighbors.size, l.target.neighbors.size)
          );
        graph.d3Force("collide", collideForce());
        graph.d3Force("section", sectionForce());
        graph.graphData({ nodes, links });

        let programmaticUntil = 0;
        const camera = (ms) => {
          programmaticUntil = performance.now() + ms + 80;
        };

        function fitAll(ms = 0) {
          camera(ms);
          graph.zoomToFit(ms, 54);
        }

        function focusCamera(ms = 650) {
          if (!selected) return;
          const box = stage.getBoundingClientRect();
          let reach = selected.r;
          selected.neighbors.forEach((id) => {
            const m = nodes[id];
            reach = Math.max(
              reach,
              Math.hypot(m.x - selected.x, m.y - selected.y) + m.r
            );
          });
          const k = Math.min(
            2.2,
            Math.max(0.5, (Math.min(box.width, box.height) / 2 - 40) / reach)
          );
          camera(ms);
          graph.centerAt(selected.x, selected.y, ms);
          graph.zoom(k, ms);
        }

        function wake() {
          const f = focusNode();
          if (f !== particleFocus) {
            particleFocus = f;
            // force-graph only rebuilds particles when this prop is set.
            graph.linkDirectionalParticles((l) =>
              !reducedMotion.matches && isFocusLink(l) ? 2 : 0
            );
          }
          graph.autoPauseRedraw(false);
          clearTimeout(pauseTimer);
          if (!focusNode() || reducedMotion.matches) {
            pauseTimer = setTimeout(() => graph.autoPauseRedraw(true), 160);
          }
        }

        function renderPanel(n) {
          const chip = (id) =>
            `<a class="chip" href="${hashFor(nodes[id].name)}" data-term="${esc(nodes[id].name)}">${esc(nodes[id].name)}</a>`;
          const linkedFrom = n.incoming.filter((id) => !n.out.includes(id));
          panelBody.innerHTML = `
            <div class="eyebrow">${esc(data.sections[n.section])}</div>
            <h1 tabindex="-1">${esc(n.name)}</h1>
            ${n.description ? `<p class="lede">${esc(n.description)}</p>` : ""}
            ${n.usage.length ? `<section class="block"><span class="label">${esc(data.labels.quotes)}</span>
              <div class="bubbles">${n.usage.map((u) => `<div class="bubble">${u}</div>`).join("")}</div>
            </section>` : ""}
            ${n.avoid ? `<section class="block"><span class="label">${esc(data.labels.note)}</span><p class="avoid">${n.avoid}</p></section>` : ""}
            ${n.out.length ? `<section class="block"><span class="label">${esc(data.labels.outgoing)}</span><div class="chips">${n.out.map(chip).join("")}</div></section>` : ""}
            ${linkedFrom.length ? `<section class="block"><span class="label">${esc(data.labels.incoming)}</span><div class="chips">${linkedFrom.map(chip).join("")}</div></section>` : ""}
            ${n.body ? `<section class="block"><details><summary><span class="label">${esc(data.labels.body)}</span></summary><div class="entry">${n.body}</div></details></section>` : ""}`;
          panel.scrollTop = 0;
        }

        function applyHash({ moveFocus = false } = {}) {
          let name = "";
          try {
            name = decodeURIComponent(location.hash.slice(1));
          } catch {
            name = "";
          }
          selected = byName.get(name) || null;
          hovered = null;
          $("hint").hidden = !!selected;
          document.body.classList.toggle("has-selection", !!selected);
          document.title = selected
            ? `${selected.name} — ${data.title}`
            : `${data.title} — Graph`;
          if (selected) {
            renderPanel(selected);
            panel.hidden = false;
            if (moveFocus)
              panelBody.querySelector("h1").focus({ preventScroll: true });
          } else {
            panel.hidden = true;
          }
          resizer.hidden = !selected;
          syncResizer();
          resize();
          if (selected) focusCamera();
          else if (graphReady) {
            userMoved = false;
            fitAll(600);
          }
          wake();
        }

        function go(name) {
          closePopovers();
          const next = name ? hashFor(name) : "";
          if (location.hash === next) {
            if (name) focusCamera();
            return;
          }
          location.hash = next;
        }

        function resize() {
          const box = stage.getBoundingClientRect();
          graph.width(Math.round(box.width)).height(Math.round(box.height));
        }

        const PANEL_MIN = 300;
        const STAGE_MIN = 320;
        const PANEL_WIDTH_KEY = `graph-explorer:${data.title}:panel-width`;
        let preferredWidth = readPanelWidth();
        let resizing = false;
        let grabOffset = 0;

        function readPanelWidth() {
          try {
            const value = Number(localStorage.getItem(PANEL_WIDTH_KEY));
            return Number.isFinite(value) && value > 0 ? value : null;
          } catch {
            return null;
          }
        }

        function savePanelWidth() {
          try {
            if (preferredWidth === null)
              localStorage.removeItem(PANEL_WIDTH_KEY);
            else localStorage.setItem(PANEL_WIDTH_KEY, String(preferredWidth));
          } catch {
            // Storage can be unavailable; the width still applies this visit.
          }
        }

        const maxPanelWidth = () => Math.max(PANEL_MIN, innerWidth - STAGE_MIN);
        const clampPanelWidth = (width) =>
          Math.round(Math.min(maxPanelWidth(), Math.max(PANEL_MIN, width)));

        function syncResizer() {
          resizer.setAttribute("aria-valuemin", String(PANEL_MIN));
          resizer.setAttribute("aria-valuemax", String(maxPanelWidth()));
          if (!panel.hidden) {
            resizer.setAttribute(
              "aria-valuenow",
              String(Math.round(panel.getBoundingClientRect().width))
            );
          }
        }

        // The saved width is kept as-is so it returns when the window grows.
        function applyPanelWidth() {
          const root = document.documentElement;
          if (preferredWidth === null)
            root.style.removeProperty("--panel-width");
          else
            root.style.setProperty(
              "--panel-width",
              `${clampPanelWidth(preferredWidth)}px`
            );
          syncResizer();
        }

        function setPanelWidth(width) {
          preferredWidth = clampPanelWidth(width);
          applyPanelWidth();
        }

        function endResize() {
          if (!resizing) return;
          resizing = false;
          document.body.classList.remove("resizing");
          savePanelWidth();
          focusCamera(200);
        }

        resizer.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          e.preventDefault();
          resizer.setPointerCapture(e.pointerId);
          grabOffset = e.clientX - panel.getBoundingClientRect().left;
          resizing = true;
          document.body.classList.add("resizing");
        });
        resizer.addEventListener("pointermove", (e) => {
          if (!resizing) return;
          const right = $("app").getBoundingClientRect().right;
          setPanelWidth(right - (e.clientX - grabOffset));
        });
        resizer.addEventListener("pointerup", endResize);
        resizer.addEventListener("pointercancel", endResize);
        resizer.addEventListener("lostpointercapture", endResize);
        resizer.addEventListener("dblclick", () => {
          preferredWidth = null;
          applyPanelWidth();
          savePanelWidth();
        });
        resizer.addEventListener("keydown", (e) => {
          const step = e.shiftKey ? 64 : 24;
          const current = panel.getBoundingClientRect().width;
          const next = {
            ArrowLeft: current + step,
            ArrowRight: current - step,
            Home: PANEL_MIN,
            End: maxPanelWidth(),
          }[e.key];
          if (next === undefined) return;
          e.preventDefault();
          setPanelWidth(next);
          savePanelWidth();
        });
        window.addEventListener("resize", applyPanelWidth);
        applyPanelWidth();

        new ResizeObserver(() => {
          resize();
          if (selected) focusCamera(resizing ? 0 : 250);
          else if (graphReady && !userMoved) fitAll(0);
          wake();
        }).observe(stage);

        function closePopovers() {
          search.hidden = true;
          info.hidden = true;
          infoBtn.setAttribute("aria-expanded", "false");
        }

        let matches = [];
        let active = 0;

        function renderResults() {
          const q = input.value.trim().toLowerCase();
          const score = (n) => {
            const name = n.name.toLowerCase();
            if (!q) return 3;
            if (name === q) return 0;
            if (name.startsWith(q)) return 1;
            if (name.includes(q)) return 2;
            return n.description.toLowerCase().includes(q) ? 3 : 9;
          };
          matches = nodes
            .filter((n) => score(n) < 9)
            .sort(
              (a, b) => score(a) - score(b) || a.name.localeCompare(b.name)
            );
          active = Math.min(active, Math.max(matches.length - 1, 0));
          results.innerHTML = matches.length
            ? matches
                .map(
                  (n, i) =>
                    `<li id="result-${i}" role="option" aria-selected="${i === active}" data-name="${esc(n.name)}">${esc(n.name)}<small>${esc(n.description)}</small></li>`
                )
                .join("")
            : `<li class="none">No matching ${esc(data.nouns)}</li>`;
          if (matches.length) {
            input.setAttribute("aria-activedescendant", `result-${active}`);
            $(`result-${active}`).scrollIntoView({ block: "nearest" });
          } else input.removeAttribute("aria-activedescendant");
        }

        function openSearch() {
          info.hidden = true;
          infoBtn.setAttribute("aria-expanded", "false");
          search.hidden = false;
          input.value = "";
          active = 0;
          renderResults();
          input.focus();
        }

        function pick(name) {
          go(name);
          requestAnimationFrame(() => {
            const heading = panelBody.querySelector("h1");
            if (heading) heading.focus({ preventScroll: true });
          });
        }

        input.addEventListener("input", () => {
          active = 0;
          renderResults();
        });
        input.addEventListener("keydown", (e) => {
          if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            e.preventDefault();
            if (!matches.length) return;
            active =
              (active + (e.key === "ArrowDown" ? 1 : -1) + matches.length) %
              matches.length;
            renderResults();
          } else if (e.key === "Enter" && matches[active]) {
            e.preventDefault();
            pick(matches[active].name);
          }
        });
        results.addEventListener("mousedown", (e) => e.preventDefault());
        results.addEventListener("click", (e) => {
          const li = e.target.closest("li[data-name]");
          if (li) pick(li.dataset.name);
        });

        $("search-btn").addEventListener("click", () =>
          search.hidden ? openSearch() : closePopovers()
        );
        infoBtn.addEventListener("click", () => {
          const open = info.hidden;
          closePopovers();
          info.hidden = !open;
          infoBtn.setAttribute("aria-expanded", String(open));
        });
        $("close").addEventListener("click", () => go(null));
        $("info-counts").textContent =
          `${nodes.length} ${nodes.length === 1 ? data.noun : data.nouns}, ${links.length} ${links.length === 1 ? "link" : "links"}, ${data.sections.length} ${data.sections.length === 1 ? "group" : "groups"}.`;

        panel.addEventListener("mouseover", (e) => {
          const a = e.target.closest("[data-term]");
          const next = a ? byName.get(a.dataset.term) || null : null;
          if (next !== hovered) {
            hovered = next;
            wake();
          }
        });
        panel.addEventListener("mouseleave", () => {
          hovered = null;
          wake();
        });

        document.addEventListener("keydown", (e) => {
          const typing = /^(INPUT|TEXTAREA)$/.test(
            document.activeElement?.tagName || ""
          );
          if (
            (e.key === "/" && !typing) ||
            (e.key.toLowerCase() === "k" && (e.metaKey || e.ctrlKey))
          ) {
            e.preventDefault();
            openSearch();
          } else if (e.key === "Escape") {
            if (!search.hidden || !info.hidden) {
              const fromSearch = !search.hidden;
              closePopovers();
              if (fromSearch) $("search-btn").focus();
            } else if (selected) go(null);
          }
        });

        window.addEventListener("hashchange", () =>
          applyHash({ moveFocus: true })
        );

        let graphReady = false;
        resize();
        setTimeout(() => {
          graphReady = true;
          if (location.hash.length > 1) applyHash();
          else fitAll(0);
        }, 60);
      })();
    </script>
  </body>
</html>
